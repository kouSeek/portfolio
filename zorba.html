riment I can shoot on my balcony or at a cafe this weekend.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_13_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Poetry-at-Speed: Tracking Metaphor Chains by Ear", "detail": "Tagore, Gulzar, and Leonard Cohen stack metaphors where Line 4 transforms the meaning of Line 1. Following a metaphor chain purely by ear stretches auditory working memory in the most pleasurable way possible.", "prompt": "Gemini, recite or craft a rich 8-line poetic passage (English, Bengali, or Urdu-Hindi with context) built around a shifting central metaphor, and let me unpack the full arc by ear.", "followup_prompt": "Gemini, reveal the deeper second layer of that metaphor so we can savor the craft together.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_13_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Bengali Cinema Poetry: Anupam Roy — 'Amake Amar Moto Thakte Dao'", "detail": "From Srijit Mukherji's Autograph, Anupam Roy captured the exact inner monologue of an introspective, idealistic Bengali mind declaring healthy autonomy: 'Let me remain in my own rhythm—I kept only what I chose to keep.'", "prompt": "Gemini, play 'Amake Amar Moto Thakte Dao' by Anupam Roy on YouTube Music.", "followup_prompt": "Gemini, unpack the metaphorical layers in 'Amake Amar Moto Thakte Dao'—including the 'Jahaj-mastul' lines—and why it became a generational classic.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_13_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Navier–Stokes Turbulence & Leonardo da Vinci's Vortex Sketches", "detail": "Five centuries before supercomputers, Leonardo da Vinci sat beside rushing water drawing multi-scale eddies splitting into smaller eddies—anticipating Andrey Kolmogorov's $-5/3$ energy cascade law of turbulence purely with naked-eye curiosity.", "prompt": "Gemini, explain Kolmogorov's turbulent energy cascade (from big stirring eddies down to viscous heat) in plain visual English.", "followup_prompt": "Gemini, why does proving smooth global solutions to 3D Navier–Stokes remain a million-dollar Millennium Prize mystery?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_13_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Singing One 4-Line Verse With Eyes Closed (Zero Sur-Inspector)", "detail": "Pick just four lines of a favorite Bengali or Hindi song today. Speak those four lines aloud first like an intimate conversation to feel the movie scene, then close your eyes and sing them at soft conversational volume—forbidding your analytical brain from grading pitch.", "prompt": "Gemini, pick a gorgeous 4-line verse from Rabindranath, Hemanta, Arijit, or Kishore and walk me through the 3-Pass Meaning-First singing exercise right now.", "followup_prompt": "Gemini, ask me how my throat and chest felt when I focused on the scene instead of checking notes.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_13_ag_4.mp3"}]}, {"day": 14, "phase": "Unburdened Presence", "title": "Natural Musical Ear Proof & Manna Dey's Philosophical Smile", "sub": "The 'Zara Zara' Proof: Strong Natural Ear, Lower Scale • Signal-vs-Tangent Filtering in Rambling Conversations • Hindi Classical-Cinema Gem", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_14.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "The 'Zara Zara' Proof: Strong Natural Ear, Lower Scale", "detail": "Stepping onto a stage in front of 500 colleagues with zero vocal training and zero soundcheck, and still hitting ~80% of the notes of a tricky melody like 'Zara Zara', is objective proof of a strong natural musical ear. The only missing piece was a 30-second technical rule: dropping the guitar scale 2–3 semitones so the chorus sits warmly in chest voice instead of clashing with the upper fifth.", "prompt": "Gemini, explain in simple acoustic terms why beginners accidentally lock onto the 5th of a strummed guitar chord instead of the root, and how pros prevent it in 5 seconds.", "followup_prompt": "Gemini, suggest two soulful Hindi or Bengali songs that sit naturally in a warm baritone/chest-voice comfort zone.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_14_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Signal-vs-Tangent Filtering in Rambling Conversations", "detail": "Real humans speak in loops, tangents, and parentheticals. Instead of getting irritated when a speaker meanders, turn it into a game: hold a 'Main Trunk' slot on your left hand and let every tangent float past harmlessly.", "prompt": "Gemini, speak a realistic 75-second human story that intentionally includes two charming tangents before landing its real point—let me extract the clean main trunk in one breath.", "followup_prompt": "Gemini, did I catch the real point cleanly without getting baited by the tangents?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_14_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Hindi Classical-Cinema Gem: Manna Dey — 'Laga Chunari Mein Daag' or 'Zindagi Kaisi Hai Paheli'", "detail": "Listen to Manna Dey effortlessly glide from philosophical warmth in 'Zindagi Kaisi Hai Paheli Haye' (from Anand, lyrics by Yogesh, music by Salil Chowdhury) into pure joy—celebrating life's unpredictability without demanding certainty.", "prompt": "Gemini, play 'Zindagi Kaisi Hai Paheli' by Manna Dey on YouTube Music.", "followup_prompt": "Gemini, unpack Yogesh's lyrics and Salil Chowdhury's orchestration in 'Zindagi Kaisi Hai Paheli'.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_14_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Wheeler's 'It from Bit' & The Participatory Universe", "detail": "Physicist John Archibald Wheeler—Feynman's PhD advisor—proposed in his delayed-choice thought experiment that observer-participancy doesn't just measure pre-existing pebbles; at the quantum foundation, asking a physical question participates in bringing the classical record into being.", "prompt": "Gemini, walk me through Wheeler's cosmic delayed-choice interferometer using a quasar gravitational lens billions of light-years away.", "followup_prompt": "Gemini, distinguish sober quantum physics here from pop-science mysticism—what did Wheeler actually mean by 'It from Bit'?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_14_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "5,000-Step Golden-Hour Panoramic Walk", "detail": "Narrow foveal screen focus activates sympathetic arousal; stepping outside at sunset and letting your eyes soften into wide panoramic horizon vision while walking physically switches on the parasympathetic brake.", "prompt": "Gemini, give me a fascinating curiosity prompt to ponder lazily during a 20-minute golden-hour walk with zero podcasts or screens if I want quiet, or walk-and-talk with me live!", "followup_prompt": "Gemini, ask me to describe three sensory details I noticed outside once I'm back.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_14_ag_4.mp3"}]}, {"day": 15, "phase": "Polymathic Play", "title": "The 70/30 Movie-Director Frame & Polyphonic Ear Separation", "sub": "The 70/30 Movie-Director Scoreboard • Socratic Question Extraction (Listening for the Missing Piece) • English Atmospheric Art-Rock", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_15.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "The 70/30 Movie-Director Scoreboard", "detail": "At L4, the actor who writes every module line alone wins; from L5 onward, the movie director who keeps a 30% solo First-Author Crown Jewel while letting peers win awards inside his 70% architectural umbrella multiplies impact without territorial stress—fire without smoke.", "prompt": "Gemini, help me audit my current technical bets using the 70/30 Crown-Jewel vs. Director Umbrella lens so I protect my deep craft without hoarding.", "followup_prompt": "Gemini, give me one calm, high-status Tech Lead phrase to align a territorial peer around API SLAs without fighting over their internal code.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_15_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Socratic Question Extraction (Listening for the Missing Piece)", "detail": "The sharpest person in a room rarely talks the most—they listen all the way through and ask the single calm question that exposes what nobody noticed was missing.", "prompt": "Gemini, present a seemingly complete 60-second plan or historical decision with one crucial blindspot left unspoken—let me listen and ask the single sharpest Socratic question.", "followup_prompt": "Gemini, tell me what my question unlocked and what other hidden angle existed.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_15_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "English Atmospheric Art-Rock: Radiohead — 'Weird Fishes / Arpeggi' or Coldplay — 'Viva La Vida'", "detail": "Put on good headphones and practice polyphonic ear separation: track how three interlocking guitar arpeggios weave a shimmering Polyrhythmic water current before the vocals even enter.", "prompt": "Gemini, play 'Weird Fishes Arpeggi' by Radiohead on YouTube Music.", "followup_prompt": "Gemini, unpack both the interlocking arpeggio architecture and the deep-ocean metaphor of escaping mental traps in 'Weird Fishes'.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_15_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Landauer's Principle: Why Forgetting Information Costs Physical Heat ($k_B T \\ln 2$)", "detail": "Reversible computation can run in principle with zero energy loss—Rolf Landauer proved in 1961 that the unavoidable thermodynamic heat bill hits at the exact moment you *erase* a bit of information (merging two logical states into one), finally exorcising Maxwell's Demon!", "prompt": "Gemini, show me how Landauer's erasure cost saves the Second Law of Thermodynamics from Maxwell's Demon.", "followup_prompt": "Gemini, how many orders of magnitude sit between the Landauer limit, a human cortical synapse (~20 watts total brain!), and today's GPU clusters?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_15_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Micro-Social Spark: 5 Minutes of Lighthearted Banter", "detail": "Loneliness melts not from heavy 3-hour heart-to-hearts, but from tiny moments of easy, zero-agenda warmth—chatting with a barista, joking with a climbing buddy, or sharing a song with a friend without solving anyone's life.", "prompt": "Gemini, brainstorm two effortless, high-warmth social micro-moments I can enjoy in Hyderabad or Kolkata this week without heavy planning.", "followup_prompt": "Gemini, remind me why light, playful connection recharges energy instead of draining it.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_15_ag_4.mp3"}]}, {"day": 16, "phase": "Polymathic Play", "title": "Crisp Beat-1 Honesty & Gulzar-Rahman's 'Ae Ajnabi'", "sub": "Dropping the 'Onugoto' Reflex: Crisp First-Beat Honesty • Cross-Cultural Parable Comprehension (Upanishadic / Zen / Sufi) • Hindi A.R. Rahman & Gulzar Peak", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_16.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "Dropping the 'Onugoto' Reflex: Crisp First-Beat Honesty", "detail": "Growing up keeping the peace trained an over-compliant 'onugoto' reflex—swallowing irritation ten times until pressure boiled over. Stating what you prefer or decline calmly on Beat 1 ('That won't work for me today, let's do Thursday' or 'Let's order from the place with proper roasted kebabs') earns instant respect and leaves zero resentment in your gut.", "prompt": "Gemini, give me three everyday examples of replacing polite over-compliance with warm, zero-apology Beat-1 honesty at work and socially.", "followup_prompt": "Gemini, test me with one mildly pushy social or work request so I can practice a relaxed 1-sentence boundary.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_16_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Cross-Cultural Parable Comprehension (Upanishadic / Zen / Sufi)", "detail": "Short parables compress huge philosophical truths into 80 words of paradoxical dialogue. Listening to a parable once with total presence trains deep semantic comprehension.", "prompt": "Gemini, tell me a lesser-known Zen, Sufi, or Upanishadic story aloud in 60 seconds—don't explain the moral yet; let me sit with it for five seconds and tell you what it points to.", "followup_prompt": "Gemini, share how different thinkers interpreted that exact story.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_16_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Hindi A.R. Rahman & Gulzar Peak: 'Dil Se Re' or 'Ae Ajnabi'", "detail": "Listen to how Gulzar writes texture and breath into Hindi/Urdu—'Patton ki tarah sookhe sookhe' or 'Pakhi hua re, chhoota jo tera haath'—while Rahman pairs haunting harmonies with visceral heartbeat percussion.", "prompt": "Gemini, play 'Ae Ajnabi' from Dil Se on YouTube Music.", "followup_prompt": "Gemini, dissect Gulzar's imagery in 'Ae Ajnabi' and how Udit Narayan's restrained, intimate opening verse creates instant emotional pull.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_16_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Prasanta Chandra Mahalanobis: Distance Geometry & Inventing Large-Scale Random Sampling in Bengal", "detail": "When measuring jute acreage across Bengal in the 1930s, P.C. Mahalanobis proved that tiny, rigorously designed random samples beat expensive, error-ridden full censuses—and invented Mahalanobis Distance to measure true anomaly distance across correlated dimensions.", "prompt": "Gemini, give me a crystal-clear geometric picture of why Euclidean distance lies when variables are correlated, and how Mahalanobis Distance stretches space to fix it.", "followup_prompt": "Gemini, share the story of how Mahalanobis founded the Indian Statistical Institute out of a single room at Presidency College.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_16_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Tech Lead Calm: Letting Others Carry Their Own Monkeys", "detail": "When a colleague brings a messy problem, the caretaker/high-IQ reflex is to say 'Give it here, I'll fix it tonight.' The visionary move is asking calm clarifying questions, agreeing on the interface contract, and letting them own their monkey.", "prompt": "Gemini, roleplay a teammate trying to hand me an ambiguous last-minute task so I can practice keeping ownership cleanly on their side of the net.", "followup_prompt": "Gemini, sharpen my response so it sounds both warm/supportive and unmistakably firm.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_16_ag_4.mp3"}]}, {"day": 17, "phase": "Polymathic Play", "title": "Deep-Roasted Craft Over Watery Gravy & Nazrul's Rhythmic Fire", "sub": "Deep-Roasted Craft Over Watery Mediocrity • Detecting Micro-Shifts in Tone & Certainty • Nazrul Geeti Raga Mastery", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_17.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Deep-Roasted Craft Over Watery Mediocrity", "detail": "Whether it is food—where you love slow-simmered kosha, charred, seared richness and hate thin, watery gravy—or software architecture and music, your taste naturally rejects diluted, half-hearted filler. Owning your high taste openly makes daily life vastly more enjoyable.", "prompt": "Gemini, suggest two high-protein, deeply roasted or slow-simmered Indian or Mediterranean dishes with rich texture and zero watery gravy.", "followup_prompt": "Gemini, connect that 'rich reduction vs. watery gravy' principle to how I can trim shallow meetings out of my week.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_17_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Detecting Micro-Shifts in Tone & Certainty", "detail": "Skilled listeners hear the exact word where a speaker's confidence wavers ('we *should* be fine', 'sort of', 'honestly'). Catching hedge words tells you immediately where the real risk or emotion lives.", "prompt": "Gemini, speak a 60-second update (work or personal) containing two subtle verbal hedges where the real truth is hiding—let me spot the exact weak joints by ear.", "followup_prompt": "Gemini, confirm whether I caught both micro-hedges and why people phrase them that way.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_17_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Nazrul Geeti Raga Mastery: Kazi Nazrul Islam — 'Karar Oi Louho Kopat' (Bhangar Gaan)", "detail": "Contrast Tagore's contemplative flow with Kazi Nazrul Islam's volcanic rhythmic pulse and classical raga ornamentation (gamak and taan)—pure Dionysian Zorba vitality in Bengali song.", "prompt": "Gemini, play 'Karar Oi Louho Kopat' on YouTube Music.", "followup_prompt": "Gemini, tell me the historical story behind Nazrul writing 'Karar Oi Louho Kopat' and how rhythm itself acts as liberation.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_17_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Claude Shannon's 1948 Masterstroke: Separating 'Information' From 'Meaning'", "detail": "In a single paper at Bell Labs, Claude Shannon birthed the digital age by defining information purely as the *reduction of uncertainty* ($H = -\\sum p_i \\log_2 p_i$), proving noisy channels can transmit data with arbitrarily zero error right up to capacity $C = B \\log_2(1 + S/N)$.", "prompt": "Gemini, explain Shannon's noisy-channel coding theorem intuition—why did every engineer in 1948 think zero-error transmission over a noisy wire without infinite power was impossible?", "followup_prompt": "Gemini, tell me about Shannon's playful side at Bell Labs—juggling on a unicycle down hallways and building the 'Ultimate Machine' that switches itself off.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_17_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Artisanal Culinary Joy: Savoring Texture Without Screens", "detail": "Whether it's crisp sourdough with olive oil, seared salmon, sushi, or slow-cooked kosha mangsho, eating your favorite meal while staring at Slack steals 80% of the sensory reward. Take 12 unhurried minutes today to actually taste the craft.", "prompt": "Gemini, recommend one standout dish or flavor pairing—Indian regional or artisanal global—worth ordering or savoring slowly today.", "followup_prompt": "Gemini, tell me the culinary chemistry r the shared synthesis.", "prompt": "Gemini, voice a 60-second mini-debate between two smart thinkers on opposite sides of a fascinating question—let me synthesize the higher-order truth that reconciles both.", "followup_prompt": "Gemini, sharpen my synthesis and connect it to a real-world system we both know.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_18_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Ukulele & Acoustic Simplicity: Israel Kamakawiwo'ole — 'Somewhere Over the Rainbow'", "detail": "Four simple ukulele chords (`C, G, Am, F`), one take recorded at 3 AM in Hawaii, and pure unguarded human warmth. Proof that musical magic comes 0% from technical showmanship and 100% from relaxed sincerity.", "prompt": "Gemini, play 'Somewhere Over the Rainbow' by Israel Kamakawiwo'ole on YouTube Music.", "followup_prompt": "Gemini, tell me the legendary 3 AM studio story behind that recording and give me the exact 4-chord ukulele strumming pattern so I can play it tonight.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_18_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Jagadish Chandra Bose: 60 GHz Millimeter Waves in 1895 & Refusing Patent Monopolies", "detail": "Decades before modern 5G millimeter-wave radar, J.C. Bose demonstrated 60 GHz wireless waves passing through solid walls at Kolkata Town Hall using handcrafted waveguide horns and semiconductor galena junctions—and refused lucrative Western patents so knowledge stayed open.", "prompt": "Gemini, explain how J.C. Bose generated and detected 5-millimeter radio waves in 1895 Kolkata when vacuum tubes didn't even exist yet.", "followup_prompt": "Gemini, how did his semiconductor crystal detector work later lead him directly into measuring electrical action potentials in plants?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_18_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Sketching 3 Imperfect Lines on Real Paper", "detail": "Just like Nandalal Bose taught at Santiniketan—fill pages boldly without erasing. Grab a pen or pencil for 4 minutes and sketch a quick chiaroscuro shadow study of a coffee mug, guitar headstock, or tree outside your window.", "prompt": "Gemini, give me a super-fun 4-minute Leonardo-style pen-and-shadow sketching prompt using just hatching and negative space.", "followup_prompt": "Gemini, let me show you my quick sketch on Gemini Live Camera so we can laugh and appreciate the lines!", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_18_ag_4.mp3"}]}, {"day": 19, "phase": "Polymathic Play", "title": "Ranaghat Roots to Frontier AI & 'Safarnama' Open-Sky Freedom", "sub": "Ranaghat Roots to Global Frontier — Owning the Whole Arc • Rapid Auditory Recall Without Re-Reading • Hindi Travel & Open-Road Freedom", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_19.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Ranaghat Roots to Global Frontier — Owning the Whole Arc", "detail": "Very few engineers carry both the sensory memory of Bengal's river towns, classical music, and Tagorean humanism alongside Google-scale AI architecture and financial independence. That rare combination is your authentic signature, never something to compartmentalize.", "prompt": "Gemini, ask me two thoughtful questions connecting my Bengal cultural roots with the kind of AI systems or open-source art I want to build in my thirties c Science, Math & Art", "title": "Gödel, Escher, Bach: Strange Loops & How Self-Reference Emerges", "detail": "Kurt Gödel encoded logical statements about numbers *as* numbers themselves (Gödel numbering), allowing mathematics to look in the mirror and say 'This statement has no proof'—shattering Hilbert's dream of a closed mechanical math box and inspiring Douglas Hofstadter's theory of 'I' as a Strange Loop.", "prompt": "Gemini, walk me through the core trick of Gödel's First Incompleteness Theorem in 60 seconds without losing rigor.", "followup_prompt": "Gemini, what do you think of Hofstadter's claim that human self-awareness ('I') is an emergent Strange Loop across neural levels?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_19_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Automate & Outsource One Annoying Life-Admin Errand", "detail": "Every rupee spent removing repetitive domestic or logistical friction buys clean prefrontal bandwidth for creation and play. Spot one nagging household or admin chore this week and hand it permanently to Autopay, a service, or an assistant.", "prompt": "Gemini, help me spot one recurring life-admin annoyance I'm still doing manually that could be automated or outsourced in 5 minutes.", "followup_prompt": "Gemini, draft the exact message, checklist, or rule to hand it off once and for all.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_19_ag_4.mp3"}]}, {"day": 20, "phase": "Polymathic Play", "title": "As the Day, So Is the Day & Tagore's Sovereign Love", "sub": "As the Day, So Is the Day (Jedin Jerokom, Sedin Serokom) • Listening for Silence & What Was Left Unsaid • Rabindra Sangeet Intimate Devotion", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_20.mp3", "ga nd capstone monologue blending science, art, and human nature—let me deliver a 2-sentence executive synthesis plus one creative riff.", "followup_prompt": "Gemini, celebrate what clicked in my listening flow and suggest how to carry this ease into everyday meetings and friendships.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_21_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Symphonic Summit: Beethoven's 9th ('Ode to Joy') — Composed in Total Deafness", "detail": "When Beethoven premiered the 9th Symphony, he could not hear a single physical sound wave in the hall—he heard the entire choir and orchestra purely inside his internal neural model, turning personal tragedy into humanity's supreme anthem of joy.", "prompt": "Gemini, play Beethoven's 'Ode to Joy' (Symphony No. 9 Finale) on YouTube Music.", "followup_prompt": "Gemini, tell me the story of the 1824 Vienna premiere when the contralto turned Beethoven around to see the audience cheering, and how his inner musical model worked.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_21_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Richard Feynman's Wobbling Cafeteria Plate -> The Nobel Prize", "detail": "Burned out after Los Alamos and feeling pointless because he was forcing himself to do 'important' physics, Feynman vowed at Cornell to play only with whatever amused him. Watching a student toss a wobbling Cornell plate in the cafeteria, he worked out the 2:1 spin-to-wobble ratio purely for fun—which directly unlocked his Nobel-winning QED diagrams!", "prompt": "Gemini, tell me Feynman's Cornell cafeteria plate story in full and how a 'useless' toy calculation ignited Quantum Electrodynamics.", "followup_prompt": "G function pickRandomNextReelIndex() {
  const len = jhFilteredReels.length;
  if (len <= 1) return 0;

  let candidates = [];
  for (let i = 0; i < len; i++) {
    const c = jhFilteredReels[i];
    if (i !== jhCurrentIdx && !jhVisitedIds.has(c.id)) {
      candidates.push(i);
    }
  }
  if (candidates.length === 0) {
    jhVisitedIds.clear();
    if (jhFilteredReels[jhCurrentIdx]) {
      jhVisitedIds.add(jhFilteredReels[jhCurrentIdx].id);
    }
    for (let i = 0; i < len; i++) {
      if (i !== jhCurrentIdx) candidates.push(i);
    }
  }
  const randPos = Math.floor(Math.random() * candidates.length);
  return candidates[randPos] !== undefined ? candidates[randPos] : 0;
}

const JH_PRONOUNCEABLE_CAPS = new Set([

const JH_SPOKEN_UNIT_EXTRA_MS = {
  ms: 540,
  hz: 220,
  khz: 450,
  mhz: 450,
  db: 380,
  cr: 260,
  vs: 260,
  etc: 460,

function isSpokenWordToken(token) {
  if (!token) return false;
  const cleaned = String(token)
    .replace(/[\u{10000}-\u{10FFFF}\u2600-\u27BF\uFE0F]/gu, '')
    .replace(/[•*#_`~↗"'“”‘’()\[\]{}]/g, '');
  return /[\u0980-\u09FF\u0900-\u097FA-Za-z0-9&+=]/.test(cleaned);
}

function computeCalibratedWordTimingWeights(rawWord, nextWord, isTitleOrHeading, isHeadingEnd) {
  const w = String(rawWord || '');
  const nw = String(nextWord || '');
  const clean = w
    .replace(/[\u{10000}-\u{10FFFF}\u2600-\u27BF\uFE0F]/gu, '')
    .replace(/[•*#_`~↗"'“”‘’()\[\]{}]/g, '');

  const hasInternalEmdash = /[A-Za-z\u0980-\u09FF][—–][A-Za-z\u0980-\u09FF]/.test(clean) ? 1 : 0;
  const subparts = clean.split(/[-—–/]+/).filter(Boolean);
  const nExtraSubwords = Math.max(0, subparts.length - 1);

  const digitMatches = clean.match(/[0-9\u09E6-\u09EF]/g);
  const digits = digitMatches ? digitMatches.length : 0;
  const hasNumRange = /[0-9\u09E6-\u09EF]\s*[—–\-/:]\s*[0-9\u09E6-\u09EF]/.test(w) ? 1 : 0;
  const hasDecimal = /[0-9\u09E6-\u09EF]\.[0-9\u09E6-\u09EF]/.test(w) ? 1 : 0;
  const symMatches = w.match(/[₹$%°+=×∝&]/g);
  const symWords = symMatches ? symMatches.length : 0;

  let acronymCaps = 0;
  let unitExtraMs = 0;
  for (let i = 0; i < subparts.length; i++) {
    const sp = subparts[i];
    const alphaOnly = sp.replace(/[^A-Za-z]/g, '');
    const lowAlpha = alphaOnly.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(JH_SPOKEN_UNIT_EXTRA_MS, lowAlpha)) {
      unitExtraMs += JH_SPOKEN_UNIT_EXTRA_MS[lowAlpha];
    } else if (alphaOnly.length >= 2 && alphaOnly === alphaOnly.toUpperCase() && !JH_PRONOUNCEABLE_CAPS.has(alphaOnly)) {
      acronymCaps += alphaOnly.length;
    } else if (/^(?:[0-9]+[A-Za-z]|[A-Za-z][0-9]+)$/.test(sp)) {
      acronymCaps += 1;
    }
  }

  const alphaStr = clean.replace(/[^A-Za-z\u0980-\u09FF\u0900-\u097F]/g, '');
  const charCount = alphaStr.length;
  const enVowelMatches = alphaStr.match(/[aeiouyAEIOUY]+/g);
  let enVowelClusters = enVowelMatches ? enVowelMatches.length : 0;
  for (let i = 0; i < subparts.length; i++) {
    const spA = subparts[i].replace(/[^A-Za-z]/g, '').toLowerCase();
    if (
      spA.length > 3 &&
      spA.endsWith('e') &&
      !spA.endsWith('le') &&
      !spA.endsWith('ee') &&
      !spA.endsWith('ie') &&
      !spA.endsWith('ye') &&
      !spA.endsWith('oe')
    ) {
      enVowelClusters = Math.max(1, enVowelClusters - 1);
    }
  }
  const indicVowelMatches = alphaStr.match(/[\u09BE-\u09CC\u09D7\u0985-\u0994\u0981-\u0983\u093E-\u094C\u0905-\u0914\u0901-\u0903]/g);
  const indicVowels = indicVowelMatches ? indicVowelMatches.length : 0;
  const syllables = charCount > 0 ? Math.max(1, enVowelClusters + indicVowels) : 0;

  let alphaMs =
    17.0 +
    159.0 * syllables +
    10.4 * charCount +
    125.0 * acronymCaps +
    118.0 * hasInternalEmdash +
    7.0 * nExtraSubwords +
    unitExtraMs;
  if (isTitleOrHeading) {
    alphaMs *= 1.15;
  }

  const numSymMs =
    215.0 * digits +
    360.0 * hasNumRange +
    325.0 * hasDecimal +
    274.0 * symWords;
  const syllableWeight = Math.round(Math.max(85, alphaMs + numSymMs));

  let pauseTier = 0;
  if (isHeadingEnd) {
    pauseTier = 3;
  } else if (/[।.?!]["'”’)\]]*$/.test(w) && !JH_ABBREV_RE.test(clean)) {
    pauseTier = 3;
  } else if (/[:;—–]["'”’)\]]*$/.test(w)) {
    pauseTier = 2;
  } else if (/[,،]["'”’)\]]*$/.test(w) || /^(?:e\.g\.|i\.e\.)/i.test(clean)) {
    pauseTier = 1;
  }

  const pauseWeight = pauseTier === 3 ? 520 : (pauseTier === 2 ? 340 : (pauseTier === 1 ? 260 : 0));
  return { syllableWeight, pauseTier, pauseWeight };
}

function escapeJhHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderJhLatexInnerHtml(latex) {
  let s = String(latex || '').trim();
  if (!s) return '';

  s = s.replace(/\\(?:left|right)\b/g, '');
  s = s.replace(/\\\$/g, '%%JHDL%%');

  const textBlocks = [];
  s = s.replace(/\\text\s*\{([^}]*)\}/g, (_, t) => {
    const id = textBlocks.length;
    textBlocks.push('<span class="jh-math-unit">' + escapeJhHtml(t) + '</span>');
    return '%%JHTXT' + id + '%%';
  });

  s = s.replace(/\\mathbb\s*\{([^{}]+)\}/g, (_, ch) => {
    const map = { R: 'ℝ', N: 'ℕ', Z: 'ℤ', Q: 'ℚ', C: 'ℂ' };
    return map[ch.trim()] || escapeJhHtml(ch);
  });

  const opBlocks = [];
  s = s.replace(/\\(exp|ln|log|sin|cos|tan|min|max)(?![A-Za-z])/g, (_, fn) => {
    const id = opBlocks.length;
    opBlocks.push('<span class="jh-math-op">' + fn + '</span>');
    return '%%JHOP' + id + '%%';
  });

  for (let i = 0; i < JH_LATEX_SYMBOLS.length; i++) {
    s = s.split(JH_LATEX_SYMBOLS[i][0]).join(JH_LATEX_SYMBOLS[i][1]);
  }

  s = escapeJhHtml(s);
  s = s.replace(/-/g, '−');
  s = s.replace(/\^\s*\{\\circ\}|\^\s*\\circ/g, '°');

  s = s.replace(/\^\s*\{([^{}]+)\}/g, '<sup class="jh-math-sup">$1</sup>');
  s = s.replace(/_\s*\{([^{}]+)\}/g, '<sub class="jh-math-sub">$1</sub>');
  s = s.replace(/\^\s*(\([0-9+\-−/]+\)|[a-zA-Z0-9+\-−πθωλμνσ∞]+)/g, '<sup class="jh-math-sup">$1</sup>');
  s = s.replace(/_\s*([a-zA-Z0-9μνπθωλσ]+)/g, '<sub class="jh-math-sub">$1</sub>');

  for (let pass = 0; pass < 2; pass++) {
    s = s.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '<span class="jh-math-frac"><span class="jh-math-num">$1</span><span class="jh-math-slash">/</span><span class="jh-math-den">$2</span></span>');
    s = s.replace(/\\sqrt\s*\{([^{}]+)\}/g, '<span class="jh-math-sqrt">√<span class="jh-math-radicand">$1</span></span>');
  }

  s = s.replace(/[{}]/g, '');
  s = s.replace(/%%JHTXT(\d+)%%/g, (_, id) => textBlocks[Number(id)] || '');
  s = s.replace(/%%JHOP(\d+)%%/g, (_, id) => opBlocks[Number(id)] || '');
  s = s.replace(/%%JHDL%%/g, '$');
  return s;
}

function humanizeLatexForJhSpeech(expr) {
  let s = String(expr || '').trim();
  if (!s) return '';
  const unitMap = {
    ms: 'milliseconds',
    s: 'seconds',
    Hz: 'Hertz',
    kHz: 'kilohertz',
    MHz: 'megahertz',
    GHz: 'gigahertz',
    dB: 'decibels',
    Re: 'the real part of'
  };
  s = s.replace(/\\(?:left|right)\b/g, '');
  s = s.replace(/\\\$|%%JHDL%%/g, '%%JHDL%%');
  s = s.replace(/\\mathbb\s*\{([^{}]+)\}/g, '$1');
  s = s.replace(/\\text\s*\{([^}]*)\}/g, (_, u) => ' ' + (unitMap[u.trim()] || u.trim()) + ' ');
  s = s.replace(/%%JHDL%%(\d+(?:,\d{3})*(?:\.\d+)?)/g, (_, num) => {
    const clean = num.replace(/,/g, '');
    if (clean.startsWith('0.') && clean.length === 4) {
      return ' ' + Math.round(parseFloat(clean) * 100) + ' cents ';
    }
    return ' ' + num + ' dollars ';
  });
  s = s.replace(/(dollars|cents)\s*\/\s*(night|day|month|year|hour)\b/g, '$1 per $2');
  s = s.replace(/\\log_2\b/g, ' log base 2 of ');
  s = s.replace(/\\ln\b/g, ' natural log of ');
  const greekSpoken = [
    ['\\theta', ' theta '], ['\\omega', ' omega '], ['\\lambda', ' lambda '],
    ['\\mu', ' mu '], ['\\nu', ' nu '], ['\\pi', ' pi '], ['\\sigma', ' sigma '],
    ['\\tau', ' tau '], ['\\alpha', ' alpha '], ['\\beta', ' beta '],
    ['\\gamma', ' gamma '], ['\\delta', ' delta '], ['\\Delta', ' delta '],
    ['\\epsilon', ' epsilon '], ['\\varepsilon', ' epsilon '], ['\\phi', ' phi '],
    ['\\Phi', ' Phi '], ['\\psi', ' psi '], ['\\Psi', ' Psi '], ['\\rho', ' rho '],
    ['\\eta', ' eta '], ['\\kappa', ' kappa '], ['\\chi', ' chi '], ['\\xi', ' xi '],
    ['\\zeta', ' zeta '], ['\\Omega', ' Omega '], ['\\Sigma', ' Sigma ']
  ];
  for (let i = 0; i < greekSpoken.length; i++) {
    s = s.split(greekSpoken[i][0]).join(greekSpoken[i][1]);
  }
  s = s.replace(/\^\s*\{\\circ\}|\^\s*\\circ|°/g, ' degrees ');
  s = s.replace(/\^\s*\{\(1\/2\)\}|\^\s*\(1\/2\)/g, ' to the one half ');
  s = s.replace(/\^\s*\{-5\/3\}|\^\s*-5\/3/g, ' to the minus 5 over 3 ');
  s = s.replace(/\^\s*\{2\/3\}|\^\s*2\/3/g, ' to the 2 over 3 ');
  s = s.replace(/\^\s*\{2\}|\^\s*2\b/g, ' squared ');
  s = s.replace(/\^\s*\{3\}|\^\s*3\b/g, ' cubed ');
  s = s.replace(/\^\s*\{-1\}|\^\s*-1\b/g, ' inverse ');
  s = s.replace(/\^\s*\{([^{}]+)\}/g, ' to the $1 ');
  s = s.replace(/\^\s*([A-Za-z0-9+\-]+)/g, ' to the $1 ');
  s = s.replace(/_\s*\{([^{}]+)\}/g, ' $1 ');
  s = s.replace(/_\s*([A-Za-z0-9]+)/g, ' $1 ');
  s = s.replace(/\\frac\s*\{1\}\s*\{2\}/g, ' one half ');
  s = s.replace(/\\frac\s*\{1\}\s*\{3\}/g, ' one third ');
  s = s.replace(/\\frac\s*\{1\}\s*\{4\}/g, ' one quarter ');
  for (let pass = 0; pass < 2; pass++) {
    s = s.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, ' $1 over $2 ');
    s = s.replace(/\\sqrt\s*\{([^{}]+)\}/g, ' the square root of $1 ');
  }
  s = s.replace(/\\exp\s*\(([^()]+)\)/g, ' e to the $1 ');
  s = s
    .replace(/\\infty/g, ' infinity ')
    .replace(/\\times/g, ' times ')
    .replace(/\\cdot/g, ' dot ')
    .replace(/\\leftrightarrow/g, ' corresponds to ')
    .replace(/\\rightarrow|\\to/g, ' approaches ')
    .replace(/\\geq|\\ge/g, ' is greater than or equal to ')
    .replace(/\\leq|\\le/g, ' is less than or equal to ')
    .replace(/\\neg/g, ' not ')
    .replace(/\\lor/g, ' or ')
    .replace(/\\land/g, ' and ')
    .replace(/\\forall/g, ' for all ')
    .replace(/\\exists/g, ' there exists ')
    .replace(/\\neq|\\ne/g, ' is not equal to ')
    .replace(/\\approx/g, ' is approximately ')
    .replace(/\\propto/g, ' is proportional to ')
    .replace(/\\sim/g, ' approximately ')
    .replace(/\\in/g, ' in ')
    .replace(/\\dots|\\ldots|\\cdots/g, ' and so on ')
    .replace(/\\sum/g, ' the sum of ')
    .replace(/\\%/g, ' percent ')
    .replace(/μ/g, ' mu ')
    .replace(/π/g, ' pi ')
    .replace(/θ/g, ' theta ')
    .replace(/ω/g, ' omega ')
    .replace(/λ/g, ' lambda ')
    .replace(/σ/g, ' sigma ')
    .replace(/Δ/g, ' delta ')
    .replace(/∞/g, ' infinity ')
    .replace(/≈/g, ' is approximately ')
    .replace(/²/g, ' squared ')
    .replace(/³/g, ' cubed ')
    .replace(/⁻¹/g, ' inverse ');
  s = s.replace(/^\s*<\s*(?=\d)/, 'under ');
  s = s.replace(/^\s*<\s*/, 'less than ');
  s = s.replace(/^\s*>\s*/, 'greater than ');
  s = s.replace(/\s*<\s*/g, ' is less than ');
  s = s.replace(/\s*>\s*/g, ' is greater than ');
  s = s.replace(/\s*=\s*/g, ' equals ');
  s = s.replace(/\s*\+\s*/g, ' plus ');
  s = s.replace(/(?:^|\s)-\s*(?=[A-Za-z0-9])/g, ' minus ');
  s = s.replace(/\s+-\s+/g, ' minus ');
  s = s.replace(/\bd\s+([A-Za-z]+)\s*\/\s*d\s*([A-Za-z]+)\b/g, 'd $1 by d $2');
  s = s.replace(/\b([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)\b/g, '$1 over $2');
  s = s.replace(/\b(\d+)\s*:\s*(\d+)\b/g, '$1 to $2');
  s = s.replace(/[\\{}]/g, ' ');
  return s.replace(/\s+/g, ' ').trim();
}

function humanizeInlineCodeForJhSpeech(code) {
  let c = String(code || '').trim();
  if (c.toUpperCase().startsWith('# NEXT')) return 'Next:';
  if (c === 'personas/*.md') return 'personas markdown files';
  if (c === 'wiki/*.md') return 'wiki markdown files';
  c = c.replace(/^#+\s*/, '').replace(/_/g, ' ');
  c = c.replace(/\.py\b/g, ' dot py').replace(/\.json\b/g, ' dot JSON').replace(/\.md\b/g, ' dot M D').replace(/\.js\b/g, ' dot J S');
  return c;
}

function preprocessJhMarkdownAndMath(rawText) {
  let s = String(rawText || '');
  const atoms = [];
  function pushAtom(html, spoken) {
    const id = atoms.length;
    atoms.push({ html, spoken: spoken || 'word' });
    return '%%JHATOM' + id + '%%';
  }

  s = s.replace(/`?\[\[([^\]|\n]+)(?:\|([^\]\n]+))?\]\]`?/g, (_, target, alias) => {
    const label = (alias || target || '').trim();
    return pushAtom(
      '<span class="jh-wikilink-pill"><span class="jh-wikilink-icon" aria-hidden="true">🔗</span>' + escapeJhHtml(label) + '</span>',
      label
    );
  });

  s = s.replace(/`([^`\n]+)`/g, (_, code) => {
    return pushAtom(
      '<code class="jh-inline-code">' + escapeJhHtml(code.trim()) + '</code>',
      humanizeInlineCodeForJhSpeech(code)
    );
  });

  s = s.replace(/\\\$/g, '%%JHDL%%');
  s = s.replace(/\$1,000,000\b/g, '%%JHDLR%%1,000,000');
  s = s.replace(/\$0\.(\d\d)(?=\s|[.,;!?)]|$)(?![^$\n]*[\\^_{}=<>/:])/g, '%%JHDLR%%0.$1');
  s = s.replace(/\$(\d+(?:,\d{3})*(?:\.\d+)?)(?=\s|[.,;!?)]|$)(?![^$\n]*[\\^_{}=<>/:])/g, '%%JHDLR%%$1');

  s = s.replace(/\$([^$\n]+)\$/g, (_, expr) => {
    return pushAtom(
      '<span class="jh-math-inline">' + renderJhLatexInnerHtml(expr) + '</span>',
      humanizeLatexForJhSpeech(expr)
    );
  });

  s = s.replace(/%%JHDL%%/g, '$');
  s = s.replace(/%%JHDLR%%/g, '$');

  s = s.replace(/<->|↔/g, () => pushAtom('<span class="jh-md-arrow">↔</span>', 'and'));
  s = s.replace(/->|→|=>|⇒/g, () => pushAtom('<span class="jh-md-arrow">→</span>', 'to'));

  s = s.replace(/\*\*([^*\n]+)\*\*/g, (_, inner) => {
    return inner.split(/(\s+)/).map(tok => (/^\s+$/.test(tok) || !tok) ? tok : ('%%JHBOLD%%' + tok)).join('');
  });
  s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, (_, inner) => {
    return inner.split(/(\s+)/).map(tok => (/^\s+$/.test(tok) || !tok) ? tok : ('%%JHEM%%' + tok)).join('');
  });

  return { text: s, atoms };
}

function expandJhTokenForSpeech(token, atoms) {
  if (!token) return '';
  return String(token)
    .replace(/%%JHBOLD%%/g, '')
    .replace(/%%JHEM%%/g, '')
    .replace(/%%JHATOM(\d+)%%/g, (_, id) => {
      const a = atoms && atoms[Number(id)];
      return a ? (' ' + a.spoken + ' ') : '';
    })
    .trim();
}

function renderJhTokenHtml(token, atoms) {
  let t = String(token || '');
  const isBold = t.includes('%%JHBOLD%%');
  const isEm = t.includes('%%JHEM%%');
  t = t.replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '');

  const segments = t.split(/(%%JHATOM\d+%%)/g);
  let out = '';
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    const m = /^%%JHATOM(\d+)%%$/.exec(seg);
    if (m) {
      const a = atoms[Number(m[1])];
      out += a ? a.html : '';
    } else if (seg) {
      out += escapeJhHtml(seg);
    }
  }
  if (isEm) out = '<em class="jh-md-em">' + out + '</em>';
  if (isBold) out = '<strong class="jh-md-strong">' + out + '</strong>';
  return out;
}

function computeJhTokenTimingWeights(rawToken, nextRawToken, atoms, isTitleOrHeading, isHeadingEnd) {
  const cleanRaw = String(rawToken || '').replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '');
  const cleanNext = String(nextRawToken || '').replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '');
  if (!/%%JHATOM\d+%%/.test(cleanRaw)) {
    return computeCalibratedWordTimingWeights(cleanRaw, cleanNext, isTitleOrHeading, isHeadingEnd);
  }
  const expanded = expandJhTokenForSpeech(cleanRaw, atoms);
  const nextExpanded = expandJhTokenForSpeech(cleanNext, atoms);
  const subWords = expanded.split(/\s+/).filter(Boolean);
  if (subWords.length <= 1) {
    const singleRes = computeCalibratedWordTimingWeights(expanded || cleanRaw, nextExpanded, isTitleOrHeading, isHeadingEnd);
    const tailSingle = computeCalibratedWordTimingWeights(cleanRaw, nextExpanded, isTitleOrHeading, isHeadingEnd);
    return {
      syllableWeight: singleRes.syllableWeight,
      pauseTier: Math.max(singleRes.pauseTier, tailSingle.pauseTier),
      pauseWeight: Math.max(singleRes.pauseWeight, tailSingle.pauseWeight)
    };
  }
  let totalSyllableWeight = 0;
  for (let i = 0; i < subWords.length; i++) {
    const sw = subWords[i];
    const nw = (i + 1 < subWords.length) ? subWords[i + 1] : nextExpanded;
    const wRes = computeCalibratedWordTimingWeights(sw, nw, isTitleOrHeading, false);
    totalSyllableWeight += wRes.syllableWeight;
  }
  const tailRes = computeCalibratedWordTimingWeights(cleanRaw, nextExpanded, isTitleOrHeading, isHeadingEnd);
  return {
    syllableWeight: totalSyllableWeight,
    pauseTier: tailRes.pauseTier,
    pauseWeight: tailRes.pauseWeight
  };
}

function wrapSingleBlockWithJhTtsWords(rawBlock, state, opts, isListItem, listBulletHtml) {
  const { text: processedText, atoms } = preprocessJhMarkdownAndMath(rawBlock);
  if (!processedText) return '';
  const rawParts = processedText.split(/(\s+)/);
  const parts = [];
  for (let rIdx = 0; rIdx < rawParts.length; rIdx++) {
    const rp = rawParts[rIdx];
    if (!rp || /^\s+$/.test(rp)) {
      parts.push(rp);
      continue;
    }
    const fmtPrefix = (rp.includes('%%JHBOLD%%') ? '%%JHBOLD%%' : '') + (rp.includes('%%JHEM%%') ? '%%JHEM%%' : '');
    const strippedRp = rp.replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '');
    if (/[A-Za-z\u0980-\u09FF\u0900-\u097F][—–][A-Za-z\u0980-\u09FF\u0900-\u097F]/.test(strippedRp)) {
      const dashSegs = strippedRp
        .replace(/([A-Za-z\u0980-\u09FF\u0900-\u097F][—–])(?=[A-Za-z\u0980-\u09FF\u0900-\u097F])/g, '$1\u0000')
        .split('\u0000');
      for (let dIdx = 0; dIdx < dashSegs.length; dIdx++) {
        parts.push(fmtPrefix + dashSegs[dIdx]);
      }
    } else {
      parts.push(rp);
    }
  }
  const spokenPartIndices = [];
  for (let i = 0; i < parts.length; i++) {
    if (isSpokenWordToken(expandJhTokenForSpeech(parts[i], atoms))) {
      spokenPartIndices.push(i);
    }
  }
  const lastSpokenPartIdx = spokenPartIndices.length ? spokenPartIndices[spokenPartIndices.length - 1] : -1;
  const prefix = (state && state.prefix) || 'jhWord';
  const blockId = (opts && opts.blockId) || '';
  const inCuriosityA = Boolean(opts && opts.inCuriosityA);
  const addHeadingPause = Boolean(opts && opts.addHeadingPause);
  const chunkSentences = Boolean(opts && opts.chunkSentences);
  if (state.sentCounter === undefined) state.sentCounter = 0;

  let spokenCursor = 0;
  const sentences = [];
  let curSentTokens = listBulletHtml ? [listBulletHtml] : [];
  let curSentPlainLen = 0;
  let curSentId = prefix + 'Sent_' + state.sentCounter;

  for (let pIdx = 0; pIdx < parts.length; pIdx++) {
    const part = parts[pIdx];
    const spokenForm = expandJhTokenForSpeech(part, atoms);
    if (!isSpokenWordToken(spokenForm)) {
      curSentTokens.push(/^\s+$/.test(part) ? part : renderJhTokenHtml(part, atoms));
      curSentPlainLen += part.length;
      continue;
    }

    const nextSpokenIdx = (spokenCursor + 1 < spokenPartIndices.length)
      ? spokenPartIndices[spokenCursor + 1]
      : -1;
    const nextSpokenWord = nextSpokenIdx >= 0 ? parts[nextSpokenIdx] : '';
    spokenCursor += 1;

    let hasTrailingDashToken = false;
    const scanEnd = nextSpokenIdx >= 0 ? nextSpokenIdx : parts.length;
    for (let k = pIdx + 1; k < scanEnd; k++) {
      const midTok = String(parts[k] || '').replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '').trim();
      if (/^[—–-]+$/.test(midTok)) {
        hasTrailingDashToken = true;
        break;
      }
    }

    const isHeadingEnd = addHeadingPause && pIdx === lastSpokenPartIdx;
    const rawWeights = computeJhTokenTimingWeights(
      part,
      nextSpokenWord,
      atoms,
      addHeadingPause,
      isHeadingEnd
    );
    const syllableWeight = rawWeights.syllableWeight;
    const pauseTier = (hasTrailingDashToken && rawWeights.pauseTier < 2) ? 2 : rawWeights.pauseTier;
    const pauseWeight = (hasTrailingDashToken && rawWeights.pauseTier < 2)
      ? Math.max(rawWeights.pauseWeight, 340)
      : rawWeights.pauseWeight;
    const weight = syllableWeight + pauseWeight;

    const wIdx = state.words.length;
    const startWeight = state.totalWeight;
    const wordEndWeight = startWeight + syllableWeight;
    const endWeight = startWeight + weight;
    state.totalWeight = endWeight;
    state.words.push({
      idx: wIdx,
      word: spokenForm,
      syllableWeight: syllableWeight,
      pauseWeight: pauseWeight,
      pauseTier: pauseTier,
      weight: weight,
      startWeight: startWeight,
      wordEndWeight: wordEndWeight,
      endWeight: endWeight,
      startSec: 0,
      endSec: 0,
      blockId: blockId,
      sentId: chunkSentences ? curSentId : '',
      inCuriosityA: inCuriosityA
    });

    const curAttr = inCuriosityA ? ' data-curiosity-a="1"' : '';
    const renderedToken = renderJhTokenHtml(part, atoms);
    const wordSpan = `<span id="${prefix}_${wIdx}" class="jh-tts-word" data-widx="${wIdx}"${curAttr}>${renderedToken}</span>`;
    curSentTokens.push(wordSpan);
    curSentPlainLen += spokenForm.length;

    const cleanTrimmed = part.replace(/%%JHBOLD%%/g, '').replace(/%%JHEM%%/g, '').trim();
    const isSentenceBoundary = pauseTier === 3 && !/^\d+\.$/.test(cleanTrimmed);
    if (chunkSentences && isSentenceBoundary) {
      sentences.push({
        id: curSentId,
        html: curSentTokens.join('').trim(),
        len: curSentPlainLen
      });
      state.sentCounter += 1;
      curSentId = prefix + 'Sent_' + state.sentCounter;
      curSentTokens = [];
      curSentPlainLen = 0;
    }
  }

  if (!chunkSentences) {
    return curSentTokens.join('');
  }

  if (curSentTokens.length > 0 && curSentTokens.join('').trim()) {
    sentences.push({
      id: curSentId,
      html: curSentTokens.join('').trim(),
      len: curSentPlainLen
    });
    state.sentCounter += 1;
  }

  if (!sentences.length) return '';

  if (isListItem) {
    const joinedSents = sentences
      .map(s => `<span id="${s.id}" class="jh-tts-sentence">${s.html}</span>`)
      .join(' ');
    return `<div class="jh-sec-para jh-sec-list-item">${joinedSents}</div>`;
  }

  const paraGroups = [];
  let currentGroup = [];
  let currentGroupLen = 0;
  for (let i = 0; i < sentences.length; i++) {
    const s = sentences[i];
    const wrappedSent = `<span id="${s.id}" class="jh-tts-sentence">${s.html}</span>`;
    currentGroup.push(wrappedSent);
    currentGroupLen += s.len;
    if (currentGroupLen >= 110 || currentGroup.length >= 2 || i === sentences.length - 1) {
      paraGroups.push(`<p class="jh-sec-para">${currentGroup.join(' ')}</p>`);
      currentGroup = [];
      currentGroupLen = 0;
    }
  }
  return paraGroups.join('');
}

function renderJhInlineStaticHtml(rawText) {
  const { text, atoms } = preprocessJhMarkdownAndMath(rawText);
  return text
    .split(/(\s+)/)
    .map(p => (/^\s+$/.test(p) ? p : renderJhTokenHtml(p, atoms)))
    .join('');
}

function formatJhPlainTitle(rawText) {
  return renderJhInlineStaticHtml(rawText)
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>');
}

function wrapTextWithJhTtsWords(text, state, opts) {
  const raw = String(text || '');
  if (!raw) return '';
  const chunkSentences = Boolean(opts && opts.chunkSentences);
  if (chunkSentences) {
    const lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean);
    return lines.map(line => {
      if (/^[-•]\s+/.test(line)) {
        const stripped = line.replace(/^[-•]\s+/, '');
        return wrapSingleBlockWithJhTtsWords(
          stripped,
          state,
          opts,
          true,
          '<span class="jh-list-bullet" aria-hidden="true">•</span> '
        );
      }
      const isNumItem = /^\d+\.\s+/.test(line);
      return wrapSingleBlockWithJhTtsWords(line, state, opts, isNumItem, '');
    }).join('');
  }
  return wrapSingleBlockWithJhTtsWords(raw, state, opts, false, '');
}

/* ACOUSTIC SILENCE-MAP & CLOSED-LOOP REGRESSION WORD TIMELINE BUILDER */
function buildAcousticWordTimeline(words, totalWeight, audioMeta) {
  if (!words || !words.length || totalWeight <= 0) return 0;

  const totalDur = (audioMeta && Number(audioMeta.dur) > 0.5)
    ? Number(audioMeta.dur)
    : Math.max(2.0, totalWeight / 1000);

  if (audioMeta && Array.isArray(audioMeta.word_starts) && audioMeta.word_starts.length === words.length) {
    for (let i = 0; i < words.length; i++) {
      const s = Math.max(0, Number(audioMeta.word_starts[i]) || 0);
      const nextS = (i + 1 < words.length) ? Math.max(s + 0.04, Number(audioMeta.word_starts[i + 1]) || 0) : totalDur;
      words[i].startSec = i === 0 ? 0 : s;
      words[i].endSec = nextS;
    }
    return totalDur;
  }

  const rawSilences = (audioMeta && Array.isArray(audioMeta.silences)) ? audioMeta.silences : [];
  const silences = [];
  for (let i = 0; i < rawSilences.length; i++) {
    const pair = rawSilences[i];
    if (Array.isArray(pair) && pair.length >= 2) {
      const s = Math.max(0, Number(pair[0]) || 0);
      const e = Math.min(totalDur, Number(pair[1]) || 0);
      if (e - s >= 0.115) {
        if (silences.length > 0 && s - silences[silences.length - 1][1] <= 0.045) {
          silences[silences.length - 1][1] = Math.max(silences[silences.length - 1][1], e);
        } else {
          silences.push([s, e]);
        }
      }
    }
  }

  if (!silences.length) {
    const lead = totalDur > 1.2 ? 0.18 : 0;
    const span = Math.max(0.4, totalDur - (totalDur > 1.2 ? 0.34 : 0));
    for (let i = 0; i < words.length; i++) {
      words[i].startSec = i === 0 ? 0 : (lead + (words[i].startWeight / totalWeight) * span);
      words[i].endSec = lead + (words[i].endWeight / totalWeight) * span;
    }
    return totalDur;
  }

  const speechStart = (silences[0][0] <= 0.08)
    ? Math.min(totalDur * 0.15, silences[0][1])
    : (totalDur > 1.2 ? 0.18 : 0.04);
  const lastSil = silences[silences.length - 1];
  const speechEnd = (lastSil[1] >= totalDur - 0.14)
    ? Math.max(speechStart + 0.4, lastSil[0])
    : Math.max(speechStart + 0.4, totalDur - 0.12);

  const innerSils = [];
  for (let i = 0; i < silences.length; i++) {
    const s = silences[i][0];
    const e = silences[i][1];
    if (s > speechStart + 0.10 && e < speechEnd - 0.10) {
      innerSils.push([s, e]);
    }
  }

  function voicedTimeAt(t) {
    const clamped = Math.max(0, Math.min(totalDur, t));
    let v = clamped;
    for (let i = 0; i < silences.length; i++) {
      const s = silences[i][0];
      const e = silences[i][1];
      if (clamped <= s) break;
      v -= (Math.min(clamped, e) - s);
    }
    return Math.max(0, v);
  }

  function invVoicedTime(targetV) {
    let lo = 0;
    let hi = totalDur;
    for (let iter = 0; iter < 26; iter++) {
      const mid = (lo + hi) * 0.5;
      if (voicedTimeAt(mid) < targetV) lo = mid;
      else hi = mid;
    }
    return (lo + hi) * 0.5;
  }

  function snapOutOfSilence(t) {
    for (let i = 0; i < silences.length; i++) {
      const s = silences[i][0];
      const e = silences[i][1];
      if (t > s + 0.01 && t < e - 0.01) return e;
    }
    return t;
  }

  let cumSyl = 0;
  for (let i = 0; i < words.length; i++) {
    words[i].cumSylStart = cumSyl;
    cumSyl += (words[i].syllableWeight || 140);
    words[i].cumSylEnd = cumSyl;
  }
  const totalSylWeight = Math.max(1.0, cumSyl);
  const vSpeechStart = voicedTimeAt(speechStart);
  const vSpeechEnd = Math.max(vSpeechStart + 0.2, voicedTimeAt(speechEnd));
  const totalVoicedSpan = vSpeechEnd - vSpeechStart;

  /* PASS 1: Global Interval Voiced-Time Viterbi Alignment on tier === 3 (Sentence & Heading Boundaries) */
  const t3Nodes = [{ wordIdx: -1, word: '__START__', cumSyl: 0 }];
  for (let i = 0; i < words.length - 1; i++) {
    if (words[i].pauseTier === 3) {
      t3Nodes.push({ wordIdx: i, word: words[i].word, cumSyl: words[i].cumSylEnd });
    }
  }
  t3Nodes.push({ wordIdx: words.length - 1, word: '__END__', cumSyl: totalSylWeight });

  const N = t3Nodes.length;
  const S = innerSils.length;
  const silVStart = innerSils.map(pair => voicedTimeAt(pair[0]));
  const silVEnd = innerSils.map(pair => voicedTimeAt(pair[1]));
  const silDur = innerSils.map(pair => pair[1] - pair[0]);

  const INF = 1e9;
  const dp = Array.from({ length: N }, () => new Float64Array(S + 2).fill(INF));
  const prevI = Array.from({ length: N }, () => new Int32Array(S + 2).fill(-1));
  const prevS = Array.from({ length: N }, () => new Int32Array(S + 2).fill(-1));
  dp[0][0] = 0;

  function nodeVStart(stIdx) {
    if (stIdx === 0) return vSpeechStart;
    if (stIdx === S + 1) return vSpeechEnd;
    return silVStart[stIdx - 1];
  }
  function nodeVEnd(stIdx) {
    if (stIdx === 0) return vSpeechStart;
    if (stIdx === S + 1) return vSpeechEnd;
    return silVEnd[stIdx - 1];
  }

  const SKIP_T3_PEN = 2.2;
  for (let iCur = 1; iCur < N; iCur++) {
    const stMin = (iCur === N - 1) ? (S + 1) : 1;
    const stMax = (iCur === N - 1) ? (S + 1) : S;

    for (let stCur = stMin; stCur <= stMax; stCur++) {
      let pauseCost = 0;
      if (stCur >= 1 && stCur <= S) {
        const d = silDur[stCur - 1];
        const wText = t3Nodes[iCur].word;
        if (d < 0.20 && !/^[\d\u09E6-\u09EF]+\.$/.test(wText)) continue;
        pauseCost = d >= 0.55 ? -0.45 : (d >= 0.40 ? -0.25 : (d < 0.28 ? 0.55 : 0.05));
      }

      const vCurStart = nodeVStart(stCur);
      const globalExpV = vSpeechStart + (t3Nodes[iCur].cumSyl / totalSylWeight) * totalVoicedSpan;
      const globalDrift = Math.abs(vCurStart - globalExpV);
      if (stCur <= S && globalDrift > Math.max(3.8, totalVoicedSpan * 0.14)) continue;

      for (let iPrev = Math.max(0, iCur - 6); iPrev < iCur; iPrev++) {
        const skippedNodes = iCur - iPrev - 1;
        const expVoiced = ((t3Nodes[iCur].cumSyl - t3Nodes[iPrev].cumSyl) / totalSylWeight) * totalVoicedSpan;
        const pStMin = (iPrev === 0) ? 0 : 1;
        const pStMax = (iPrev === 0) ? 0 : (stCur - 1);

        for (let stPrev = pStMin; stPrev <= pStMax; stPrev++) {
          if (dp[iPrev][stPrev] >= INF) continue;
          const vPrevEnd = nodeVEnd(stPrev);
          const actualVoiced = vCurStart - vPrevEnd;
          if (actualVoiced < Math.max(0.12, expVoiced * 0.38)) continue;
          if (actualVoiced > Math.max(expVoiced * 2.25, expVoiced + 3.6)) continue;

          const intervalErr = Math.abs(actualVoiced - expVoiced);
          const relErr = intervalErr / Math.max(0.8, Math.sqrt(expVoiced));
          const transCost =
            intervalErr * 0.70 +
            relErr * 0.45 +
            globalDrift * 0.15 +
            skippedNodes * SKIP_T3_PEN +
            pauseCost;
          const cand = dp[iPrev][stPrev] + transCost;
          if (cand < dp[iCur][stCur]) {
            dp[iCur][stCur] = cand;
            prevI[iCur][stCur] = iPrev;
            prevS[iCur][stCur] = stPrev;
          }
        }
      }
    }
  }

  const t3Matches = new Map();
  if (dp[N - 1][S + 1] < INF) {
    let ci = N - 1;
    let cs = S + 1;
    while (ci > 0 && cs >= 0) {
      const pi = prevI[ci][cs];
      const ps = prevS[ci][cs];
      if (pi < 0) break;
      if (pi > 0 && ps >= 1 && ps <= S) {
        t3Matches.set(t3Nodes[pi].wordIdx, ps - 1);
      }
      ci = pi;
      cs = ps;
    }
  } else {
    let fbSilIdx = -1;
    let fbTEnd = speechStart;
    let fbSylEnd = 0;
    for (let m = 1; m < N - 1; m++) {
      const wIdx = t3Nodes[m].wordIdx;
      const vLast = voicedTimeAt(fbTEnd);
      const remVoiced = Math.max(0.05, vSpeechEnd - vLast);
      const remSyl = Math.max(1.0, totalSylWeight - fbSylEnd);
      const predT = invVoicedTime(vLast + ((t3Nodes[m].cumSyl - fbSylEnd) / remSyl) * remVoiced);
      let bestK = -1;
      let bestCost = 999.0;
      for (let sIdx = fbSilIdx + 1; sIdx < S; sIdx++) {
        const sStart = innerSils[sIdx][0];
        const sDur = silDur[sIdx];
        if (sStart <= fbTEnd + 0.08) continue;
        if (sStart - predT > 1.75) break;
        if (sDur < 0.20) continue;
        const dist = Math.abs(sStart - predT);
        if (dist <= 1.75) {
          const cost = dist + 0.4 * Math.abs(sDur - 0.52);
          if (cost < bestCost) {
            bestCost = cost;
            bestK = sIdx;
          }
        }
      }
      if (bestK >= 0) {
        t3Matches.set(wIdx, bestK);
        fbSilIdx = bestK;
        fbTEnd = innerSils[bestK][1];
        fbSylEnd = t3Nodes[m].cumSyl;
      }
    }
  }

  const pass1Anchors = [];
  for (let i = 1; i < N - 1; i++) {
    const wIdx = t3Nodes[i].wordIdx;
    if (t3Matches.has(wIdx)) {
      const sIdx = t3Matches.get(wIdx);
      pass1Anchors.push({
        endWordIdx: wIdx,
        silIdx: sIdx,
        endSec: innerSils[sIdx][0],
        nextStartSec: innerSils[sIdx][1]
      });
    }
  }
  pass1Anchors.push({
    endWordIdx: words.length - 1,
    silIdx: S,
    endSec: speechEnd,
    nextStartSec: totalDur
  });

  /* PASS 2: Intra-Sentence Voiced-Time Clause Alignment on tier === 1 & 2 */
  const anchors = [];
  let spanStartWord = 0;
  let spanStartSec = speechStart;
  let spanStartSilIdx = 0;

  for (let pIdx = 0; pIdx < pass1Anchors.length; pIdx++) {
    const p1 = pass1Anchors[pIdx];
    const spanEndWord = p1.endWordIdx;
    const spanEndSec = p1.endSec;
    const spanEndSilIdx = p1.silIdx;

    const vSpanStart = voicedTimeAt(spanStartSec);
    const vSpanEnd = Math.max(vSpanStart + 0.05, voicedTimeAt(spanEndSec));
    const spanStartSyl = spanStartWord > 0 ? words[spanStartWord - 1].cumSylEnd : 0;
    const spanEndSyl = words[spanEndWord].cumSylEnd;

    let lastSubSilIdx = spanStartSilIdx - 1;
    let lastSubTEnd = spanStartSec;
    let lastSubSylEnd = spanStartSyl;

    for (let wIdx = spanStartWord; wIdx < spanEndWord; wIdx++) {
      const w = words[wIdx];
      const tier = w.pauseTier || 0;
      if (tier === 0) continue;

      const vSubLast = voicedTimeAt(lastSubTEnd);
      const remSubVoiced = Math.max(0.03, vSpanEnd - vSubLast);
      const remSubSyl = Math.max(1.0, spanEndSyl - lastSubSylEnd);
      const dSyl = Math.max(0, w.cumSylEnd - lastSubSylEnd);
      const predV = vSubLast + (dSyl / remSubSyl) * remSubVoiced;
      const predT = invVoicedTime(predV);
      const maxTol = 1.20;

      let bestK = -1;
      let bestCost = 999.0;
      for (let sIdx = Math.max(spanStartSilIdx, lastSubSilIdx + 1); sIdx < spanEndSilIdx; sIdx++) {
        const sStart = innerSils[sIdx][0];
        const sEnd = innerSils[sIdx][1];
        const sDur = sEnd - sStart;
        if (sStart <= lastSubTEnd + 0.08) continue;
        if (sEnd >= spanEndSec - 0.08) break;
        if (sStart - predT > maxTol) break;
        if (sDur < 0.15 && Math.abs(sStart - predT) > 0.18) continue;

        const dist = Math.abs(sStart - predT);
        if (dist <= maxTol) {
          const expP = tier >= 2 ? 0.36 : 0.28;
          const cost = dist + 0.35 * Math.abs(sDur - expP);
          if (cost < bestCost) {
            bestCost = cost;
            bestK = sIdx;
          }
        }
      }

      if (bestK >= 0) {
        anchors.push({
          endWordIdx: wIdx,
          endSec: innerSils[bestK][0],
          nextStartSec: innerSils[bestK][1]
        });
        lastSubSilIdx = bestK;
        lastSubTEnd = innerSils[bestK][1];
        lastSubSylEnd = w.cumSylEnd;
      }
    }

    anchors.push({
      endWordIdx: spanEndWord,
      endSec: p1.endSec,
      nextStartSec: p1.nextStartSec
    });

    spanStartWord = spanEndWord + 1;
    spanStartSec = p1.nextStartSec;
    spanStartSilIdx = spanEndSilIdx + 1;
  }

  let segStartWordIdx = 0;
  let segStartSec = speechStart;
  for (let sIdx = 0; sIdx < anchors.length; sIdx++) {
    const seg = anchors[sIdx];
    const vStart = voicedTimeAt(segStartSec);
    const vEnd = Math.max(vStart + 0.02, voicedTimeAt(seg.endSec));
    const segWeights = [];
    let cumW = 0;

    for (let j = segStartWordIdx; j <= seg.endWordIdx; j++) {
      const sMs = words[j].syllableWeight || 140;
      const pMs = words[j].pauseWeight !== undefined
        ? words[j].pauseWeight
        : (words[j].pauseTier === 3 ? 520 : (words[j].pauseTier >= 1 ? 260 : 0));
      const wEff = (j === seg.endWordIdx) ? sMs : (sMs + pMs * 0.15);
      segWeights.push([cumW, cumW + wEff]);
      cumW += wEff;
    }

    const totalSegW = Math.max(1.0, cumW);
    for (let offset = 0; offset < segWeights.length; offset++) {
      const j = segStartWordIdx + offset;
      const f0 = segWeights[offset][0] / totalSegW;
      const f1 = segWeights[offset][1] / totalSegW;
      const rawStart = (j === segStartWordIdx) ? segStartSec : invVoicedTime(vStart + f0 * (vEnd - vStart));
      const rawEnd = (j === seg.endWordIdx) ? seg.nextStartSec : invVoicedTime(vStart + f1 * (vEnd - vStart));
      words[j].startSec = j === 0 ? 0 : snapOutOfSilence(rawStart);
      words[j].endSec = Math.max(words[j].startSec + 0.02, rawEnd);
      if (j > segStartWordIdx && words[j].startSec > words[j - 1].endSec) {
        words[j - 1].endSec = words[j].startSec;
      }
    }

    segStartWordIdx = seg.endWordIdx + 1;
    segStartSec = seg.nextStartSec;
  }

  return totalDur;
}

function stopJhWordHighlightLoop() {
  if (jhWordHighlightTimer) {
    clearInterval(jhWordHighlightTimer);
    jhWordHighlightTimer = null;
  }
}

function updateJhTopAudioProgress(pct) {
  const progEl = document.getElementById('jhTopAudioProgressFill');
  if (progEl && progEl.style) {
    const clean = Math.max(0, Math.min(100, Number(pct) || 0));
    progEl.style.width = clean > 0 ? clean.toFixed(1) + '%' : '0%';
  }
}

function getOffsetTopWithinContainer(el, container) {
  let top = 0;
  let node = el;
  let guard = 0;
  while (node && node !== container && guard < 16) {
    top += (Number(node.offsetTop) || 0);
    node = node.offsetParent;
    guard += 1;
  }
  return top;
}

function scrollActiveWordIntoComfortZone(activeEl, isLetter) {
  if (!activeEl) return;
  if (typeof window !== 'undefined' && (window.scrollY || window.pageYOffset)) {
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  const now = Date.now();
  if (!isLetter && now < jhPageTurnTopLockUntil) return;
  if (now - jhLastUserScrollInteractionMs < 1400) return;
  if (now - jhLastAutoScrollMs < 260) return;

  const container = isLetter
    ? (typeof document !== 'undefined' && document.querySelector && document.querySelector('#jhLetterDrawer .jh-drawer-sheet'))
    : (typeof document !== 'undefined' && document.getElementById && document.getElementById('jhReelsViewport'));
  if (!container) return;

  const cHeight = Number(container.clientHeight) || 0;
  if (!(cHeight > 40) || activeEl.offsetTop === undefined) return;

  const elTopInDoc = getOffsetTopWithinContainer(activeEl, container);
  const elHeight = Number(activeEl.offsetHeight) || 24;
  const curScroll = Number(container.scrollTop) || 0;
  const relTop = elTopInDoc - curScroll;
  const relBottom = relTop + elHeight;

  const upperComfort = cHeight * 0.16;
  const lowerComfort = cHeight * 0.58;

  if (relBottom > lowerComfort || (curScroll > 10 && relTop < upperComfort)) {
    jhLastAutoScrollMs = now;
    const maxScroll = Math.max(0, (Number(container.scrollHeight) || 0) - cHeight);
    const targetTop = (elTopInDoc < cHeight * 0.45 || (!isLetter && jhActiveWordIdx >= 0 && jhActiveWordIdx < 12))
      ? 0
      : Math.max(0, Math.min(maxScroll, Math.round(elTopInDoc - cHeight * 0.30)));
    if (typeof container.scrollTo === 'function') {
      try {
        container.scrollTo({ top: targetTop, behavior: 'smooth' });
        return;
      } catch (e) {}
    }
    container.scrollTop = targetTop;
  }
}

function clearJhWordHighlight() {
  stopJhWordHighlightLoop();
  const words = jhAudioMode === 'letter' ? jhLetterWordTimings : jhCurrentWordTimings;
  const prefix = jhAudioMode === 'letter' ? 'jhLetterWord' : 'jhWord';
  const clearedBlocks = new Set();
  const clearedSents = new Set();

  for (let i = 0; i < words.length; i++) {
    const el = document.getElementById(prefix + '_' + i);
    if (el && el.classList) {
      el.classList.remove('jh-word-active');
      el.classList.remove('jh-word-spoken');
    }
    const bId = words[i] && words[i].blockId;
    if (bId && !clearedBlocks.has(bId)) {
      clearedBlocks.add(bId);
      const bEl = document.getElementById(bId);
      if (bEl && bEl.classList) bEl.classList.remove('jh-block-active');
    }
    const sId = words[i] && words[i].sentId;
    if (sId && !clearedSents.has(sId)) {
      clearedSents.add(sId);
      const sEl = document.getElementById(sId);
      if (sEl && sEl.classList) sEl.classList.remove('jh-sentence-active');
    }
  }
  updateJhTopAudioProgress(0);
  jhActiveWordIdx = -1;
}

function syncJhWordHighlightToTime(currentTimeSec, durationSec) {
  const isLetter = jhAudioMode === 'letter';
  const words = isLetter ? jhLetterWordTimings : jhCurrentWordTimings;
  const totalWeight = isLetter ? jhLetterTotalWeight : jhCurrentTotalWeight;
  const timelineDur = isLetter ? jhLetterTimelineDur : jhCurrentTimelineDur;
  const prefix = isLetter ? 'jhLetterWord' : 'jhWord';

  if (!words || !words.length || totalWeight <= 0) return -1;

  const baseDur = timelineDur > 0.5 ? timelineDur : Math.max(1.5, totalWeight / 1000);
  let effDur = (Number.isFinite(durationSec) && durationSec > 0.5) ? durationSec : baseDur;
  if (!isLetter && jhActiveCutSec > 2 && effDur > jhActiveCutSec) {
    effDur = jhActiveCutSec;
  }

  const aud = getJhAudioEl();
  const rawCurSec = (Number.isFinite(currentTimeSec) && currentTimeSec >= 0)
    ? currentTimeSec
    : (aud && Number.isFinite(aud.currentTime) && aud.currentTime >= 0 ? aud.currentTime : 0);

  const scaleFactor = (Math.abs(effDur - baseDur) > 1.0 && effDur > 0.5)
    ? (baseDur / effDur)
    : 1.0;
  const targetSec = Math.max(0, Math.min(baseDur - 0.001, rawCurSec * scaleFactor));
  if (!isLetter) {
    updateJhTopAudioProgress((targetSec / Math.max(0.5, baseDur)) * 100);
  }

  let lo = 0;
  let hi = words.length - 1;
  let foundIdx = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const w = words[mid];
    if (targetSec < w.startSec) {
      hi = mid - 1;
    } else if (targetSec >= w.endSec) {
      foundIdx = mid;
      lo = mid + 1;
    } else {
      foundIdx = mid;
      break;
    }
  }

  if (foundIdx === jhActiveWordIdx) return foundIdx;

  const prevIdx = jhActiveWordIdx;
  if (prevIdx >= 0 && foundIdx === prevIdx + 1) {
    const prevEl = document.getElementById(prefix + '_' + prevIdx);
    if (prevEl && prevEl.classList) {
      prevEl.classList.remove('jh-word-active');
      prevEl.classList.add('jh-word-spoken');
    }
    const nextEl = document.getElementById(prefix + '_' + foundIdx);
    if (nextEl && nextEl.classList) {
      nextEl.classList.remove('jh-word-spoken');
      nextEl.classList.add('jh-word-active');
    }
  } else {
    for (let i = 0; i < words.length; i++) {
      const el = document.getElementById(prefix + '_' + i);
      if (el && el.classList) {
        el.classList.toggle('jh-word-active', i === foundIdx);
        el.classList.toggle('jh-word-spoken', i < foundIdx);
      }
    }
  }

  const prevWord = prevIdx >= 0 ? words[prevIdx] : null;
  const curWord = words[foundIdx];
  if (prevWord && prevWord.blockId && (!curWord || prevWord.blockId !== curWord.blockId)) {
    const prevBlock = document.getElementById(prevWord.blockId);
    if (prevBlock && prevBlock.classList) prevBlock.classList.remove('jh-block-active');
  }
  if (curWord && curWord.blockId) {
    const curBlock = document.getElementById(curWord.blockId);
    if (curBlock && curBlock.classList) curBlock.classList.add('jh-block-active');
  }

  if (prevWord && prevWord.sentId && (!curWord || prevWord.sentId !== curWord.sentId)) {
    const prevSent = document.getElementById(prevWord.sentId);
    if (prevSent && prevSent.classList) prevSent.classList.remove('jh-sentence-active');
  }
  if (curWord && curWord.sentId) {
    const curSent = document.getElementById(curWord.sentId);
    if (curSent && curSent.classList) curSent.classList.add('jh-sentence-active');
  }

  if (!isLetter && curWord && curWord.inCuriosityA) {
    const card = jhFilteredReels[jhCurrentIdx];
    if (card && !jhRevealedMap[card.id]) {
      jhRevealedMap[card.id] = true;
      const box = document.getElementById('jhCurBox_' + jhCurrentIdx);
      if (box && box.classList) {
        box.classList.add('revealed');
        const hint = box.querySelector ? box.querySelector('.jh-curiosity-tap-hint') : null;
        if (hint) hint.textContent = '✨ Revealed';
      }
    }
  }

  const activeEl = document.getElementById(prefix + '_' + foundIdx);
  scrollActiveWordIntoComfortZone(activeEl, isLetter);

  jhActiveWordIdx = foundIdx;
  return foundIdx;
}

function startJhWordHighlightLoop(cutSec, keepCurrentPos) {
  stopJhWordHighlightLoop();
  jhActiveCutSec = Number(cutSec) || 0;
  jhAudioStartedAtMs = Date.now();
  if (!keepCurrentPos) {
    syncJhWordHighlightToTime(0, 0);
  }
  jhWordHighlightTimer = setInterval(() => {
    if (!jhAudioPlaying) {
      stopJhWordHighlightLoop();
      return;
    }
    const aud = getJhAudioEl();
    if (!aud || aud.paused || aud.seeking) return;
    if (Number.isFinite(aud.currentTime)) {
      const dur = Number.isFinite(aud.duration) && aud.duration > 0 ? aud.duration : 0;
      syncJhWordHighlightToTime(aud.currentTime, dur);
    }
  }, 35);
}

function pauseJhAudio() {
  if (!jhAudioPlaying) return;
  stopJhWordHighlightLoop();
  const aud = getJhAudioEl();
  if (aud) {
    try { aud.pause(); } catch (e) {}
  }
  jhAudioPlaying = false;
  jhAudioPaused = true;
  updateActiveCardPlayBtns();
}

function resumeJhAudio() {
  if (!jhAudioPaused) return;
  const aud = getJhAudioEl();
  if (!aud) return;
  jhAudioPlaying = true;
  jhAudioPaused = false;
  updateActiveCardPlayBtns();
  startJhWordHighlightLoop(jhActiveCutSec, true);
  const playPromise = typeof aud.play === 'function' ? aud.play() : null;
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(() => {
      jhAudioPlaying = false;
      jhAudioPaused = true;
      stopJhWordHighlightLoop();
      updateActiveCardPlayBtns();
    });
  }
}

function stopJhAudio() {
  if (jhAutoAdvanceTimer) {
    clearTimeout(jhAutoAdvanceTimer);
    jhAutoAdvanceTimer = null;
  }
  const aud = getJhAudioEl();
  if (aud) {
    try {
      aud.pause();
      aud.currentTime = 0;
    } catch (e) {}
  }
  jhAudioPlaying = false;
  jhAudioPaused = false;
  clearJhWordHighlight();
  updateActiveCardPlayBtns();
}

function spawnLotusBurst(x, y, symbols) {
  if (typeof document === 'undefined' || !document.body) return;
  const icons = symbols || ['❤️', '⚡', '✨', '🦁'];
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('div');
    el.className = 'jh-particle-burst';
    el.textContent = icons[i % icons.length];
    const dx = (Math.random() - 0.5) * 90;
    el.style.left = Math.max(20, Math.min(window.innerWidth - 40, (x || window.innerWidth * 0.8) + dx)) + 'px';
    el.style.top = Math.max(60, (y || window.innerHeight * 0.75) - i * 12) + 'px';
    document.body.appendChild(el);
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 1150);
  }
}
