/* ============================================================================
   ✨ ঝলক (JHALAK) — FULL-SCREEN ZERO-WASTE MOBILE-FIRST THEME, HEADER LISTEN,
   BOTTOM LIKE+DONE BAR, AND OPPOSITE-DIRECTION EDGE-TO-EDGE SWIPE ANIMATION
   ============================================================================ */
:root {
  --jh-bg-deep: #140F0C;
  --jh-surface-cream: #FFFDF9;
  --jh-surface-soft: #FBF4E8;
  --jh-ink-dark: #1F1610;
  --jh-ink-muted: #5C4938;
  --jh-gold: #F59E0B;
  --jh-terra: #D9532F;
  --jh-emerald: #0E8358;
  --jh-rose: #E11D48;
  --jh-border-gold: rgba(245, 158, 11, 0.36);
  --jh-safe-top: env(safe-area-inset-top, 0px);
  --jh-safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: 100vw;
  height: 100%;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--jh-surface-cream);
  color: var(--jh-ink-dark);
  font-family: 'Noto Sans Bengali', sans-serif;
  line-height: 1.56;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================================
   1. FLOATING SETTINGS BUTTON & IN-SETTINGS CATEGORY DROPDOWN (NO HEADER BAR)
   ============================================================================ */
.jh-top-audio-progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 98;
  background: transparent;
  overflow: hidden;
  pointer-events: none;
}

.jh-top-audio-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #F59E0B 0%, #10B981 100%);
  border-radius: 0 999px 999px 0;
  transition: width 0.12s linear;
}

.jh-brand-logo {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  line-height: 1;
  margin-right: 4px;
  user-select: none;
}

.jh-cat-dropdown-wrap {
  position: relative;
  width: 100%;
}

.jh-cat-dropdown-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  background: var(--jh-gold);
  color: #1F1610;
  border: 1.5px solid #FDE68A;
  font-family: 'Noto Sans Bengali', sans-serif;
  font-size: 0.94rem;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.jh-cat-dropdown-btn:active {
  transform: scale(0.98);
}

.jh-settings-voice-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.jh-settings-voice-row .jh-top-listen-btn {
  flex: 1 1 auto;
  min-height: 42px;
  border-radius: 12px;
  font-size: 0.92rem;
}

.jh-top-listen-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 34px;
  background: var(--jh-emerald);
  color: #FFFFFF;
  border: none;
  border-radius: 999px;
  padding: 5px 12px;
  font-family: 'Noto Sans Bengali', sans-serif;
  font-size: 0.84rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(14, 131, 88, 0.3);
}

.jh-top-listen-btn.playing {
  background: #D97706;
}

.jh-top-listen-btn.paused {
  background: #2563EB;
}

.jh-top-listen-btn:active {
  transform: scale(0.95);
}

.jh-top-stop-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 34px;
  background: #DC2626;
  color: #FFFFFF;
  border: none;
  border-radius: 999px;
  padding: 5px 10px;
  font-family: 'Noto Sans Bengali', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
}

.jh-top-stop-btn:active {
  transform: scale(0.95);
}

.jh-gear-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--jh-border-gold);
  background: rgba(24, 18, 14, 0.82);
  color: #FFFBEB;
  font-size: 1.05rem;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.24);
}

.jh-floating-gear-btn {
  position: fixed;
  top: calc(10px + var(--jh-safe-top));
  right: 12px;
  z-index: 95;
}

.jh-gear-btn:active {
  transform: scale(0.92);
}

/* In-Settings expandable category menu (NO COUNTS IN DROPDOWN) */
.jh-cat-dropdown-menu {
  display: none;
  position: relative;
  width: 100%;
  max-height: 46dvh;
  overflow-y: auto;
  background: var(--jh-surface-cream);
  color: var(--jh-ink-dark);
  border: 2px solid var(--jh-gold);
  border-radius: 14px;
  padding: 10px;
  margin-top: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  z-index: 10;
}

.jh-cat-dropdown-menu.open {
  display: block;
  animation: jhMenuPop 0.16s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes jhMenuPop {
  0% { opacity: 0; transform: translateY(-6px) scale(0.98); }

/* ============================================================================
   2. FULL-SCREEN EDGE-TO-EDGE VIEWPORT, ELASTIC PULL-TO-TURN INDICATORS &
      3D CURTAIN-LIFT PAGE TRANSITIONS (APPLE BOOKS / WECHAT READ STYLE)
   ============================================================================ */
.jh-reels-viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--jh-surface-cream);
  scroll-padding-top: 24px;
  scroll-padding-bottom: 48px;
}

.jh-reel-slide {
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 100%;
  background: var(--jh-surface-cream);
  backface-visibility: hidden;
  transform-origin: top center;
}

.jh-reel-slide.jh-initial-load {
  animation: none !important;
  transform: none !important;
}

.jh-reel-slide.jh-pull-springback {
  transition: transform 0.34s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Strong 3D Curtain-Lift & Depth-Peel vertical page transitions:
   - Next (long pull at bottom): current scales & lifts up (0% -> -104%), next rises from bottom (+102% -> 0%)
   - Prev (pull at top): current scales & drops down (0% -> +104%), prev glides down from top (-102% -> 0%) */
.jh-slide-anim-next {
  animation: jhProSidewaysInNext 0.44s cubic-bezier(0.19, 1, 0.22, 1) both;
}

.jh-slide-anim-prev {
  animation: jhProSidewaysInPrev 0.44s cubic-bezier(0.19, 1, 0.22, 1) both;
}

.jh-outgoing-ghost {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--jh-surface-cream);
  pointer-events: none;
  z-index: 1;
  backface-visibility: hidden;
  transform-origin: top center;
}

.jh-outgoing-ghost.out-left,
.jh-outgoing-ghost.out-up {
  animation: jhProSidewaysOutLeft 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

.jh-outgoing-ghost.out-right,
.jh-outgoing-ghost.out-down {
  animation: jhProSidewaysOutRight 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
}

@keyframes jhProSidewaysInNext {
  0% {
    transform: translate3d(0, 102%, 0) scale(0.95);
    box-shadow: 0 -24px 56px rgba(15, 10, 7, 0.65), 0 -4px 0 #F59E0B;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
  }
  75% {
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }
}

@keyframes jhProSidewaysOutLeft {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 1;
    visibility: visible;
  }
  92% {
    opacity: 0.28;
    visibility: visible;
  }
  100% {
    transform: translate3d(0, -104%, 0) scale(0.91);
    opacity: 0;
    visibility: hidden;
  }
}

@keyframes jhProSidewaysInPrev {
  0% {
    transform: translate3d(0, -102%, 0) scale(0.95);
    box-shadow: 0 24px 56px rgba(15, 10, 7, 0.65), 0 4px 0 #F59E0B;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
  }
  75% {
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
  }
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }
}

@keyframes jhProSidewaysOutRight {
  0% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 1;
    visibility: visible;
  }
  92% {
    opacity: 0.28;
    visibility: visible;
  }
  100% {
    transform: translate3d(0, 104%, 0) scale(0.91);
    opacity: 0;
    visibility: hidden;
  }
}

/* DOUBLE-TAP VOICE PLAY/PAUSE FEEDBACK TOAST */
.jh-dbltap-voice-toast {
  position: fixed;
  z-index: 95;
  transform: translate3d(-50%, -50%, 0);
  background: rgba(15, 23, 42, 0.92);
  color: #FFFDF9;
  border: 2px solid #F59E0B;
  border-radius: 999px;

  font-size: 1.25rem;
  font-weight: 800;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  white-space: nowrap;
  animation: jhDblTapToastPop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

@keyframes jhDblTapToastPop {
  0% {
    opacity: 0;
    transform: translate3d(-50%, -40%, 0) scale(0.78);
  }
  22% {
    opacity: 1;
    transform: translate3d(-50%, -50%, 0) scale(1.04);
  }
  75% {
    opacity: 0.96;
    transform: translate3d(-50%, -58%, 0) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate3d(-50%, -70%, 0) scale(0.92);
  }
}

/* LIVE ELASTIC OVERSCROLL PULL-TO-TURN PROGRESS BAR ONLY (NO TEXT) */
.jh-pull-indicator {
  position: fixed;
  left: 50%;
  z-index: 88;
  width: min(88vw, 380px);
  background: rgba(24, 18, 14, 0.95);
  border: 2px solid #F59E0B;
  border-radius: 999px;
  padding: 8px 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
  display: flex;
  flex-direction: column;
}

.jh-pull-indicator-top {
  top: calc(14px + var(--jh-safe-top));
  transform: translate3d(-50%, -18px, 0) scale(0.94);
}

.jh-pull-indicator-bottom {
  bottom: calc(14px + var(--jh-safe-bottom));
  transform: translate3d(-50%, 18px, 0) scale(0.94);
}

.jh-pull-indicator.visible {
  opacity: 1;
}

.jh-pull-indicator.ready {
  background: linear-gradient(135deg, #065F46 0%, #047857 100%);
  border-color: #34D399;
  box-shadow: 0 14px 36px rgba(5, 150, 105, 0.48), 0 0 0 3px rgba(52, 211, 153, 0.28);
}

.jh-pull-row,
#jhPullTopText,
#jhPullBottomText,
#jhPullTopArrow,
#jhPullBottomArrow {
  display: none !important;
}

.jh-pull-progress-track {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  overflow: hidden;
}

.jh-pull-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FBBF24 0%, #F59E0B 100%);
  border-radius: 999px;
  transition: width 0.06s linear;
}

  background: linear-gradient(90deg, #6EE7B7 0%, #34D399 100%);
}

.jh-bottom-pull-cue {
  display: none !important;
}

/* ============================================================================
   ⚡ ZORBA — ZERO-COGNITIVE-LOAD, NEURO-INCLUSIVE AUTONOMOUS READER THEME
   Designed for effortless reading, listening, and concentration:
   - Locked top header (`top: 0`, zero gap, live 3px audio progress bar)
   - Warm glare-free paper surface (`#FAF8F5`) with humanist sans-serif typography
   - Guided Focus Spotlight Mode during voice read-out (dims non-active cards,
     softly highlights active sentence, and spotlights active spoken word with
     zero per-word box clutter on already-spoken words)
   - Always-open Takeaway card (zero "Tap to Reveal" friction)
   ============================================================================ */
:root {
  --jh-bg-deep: #0F172A;
  --jh-surface-cream: #FAF8F5;
  --jh-surface-soft: #F3EFEA;
  --jh-ink-dark: #0F172A;
  --jh-ink-muted: #475569;
  --jh-gold: #F59E0B;
  --jh-terra: #0D9488;
  --jh-emerald: #0D9488;
  --jh-rose: #E11D48;
  --jh-border-gold: rgba(245, 158, 11, 0.42);
}

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Noto Sans Bengali', sans-serif;
  background: var(--jh-surface-cream);
  color: var(--jh-ink-dark);
}

.jh-floating-gear-btn {
  background: rgba(15, 23, 42, 0.88);
  color: #F8FAFC;
  border: 1.5px solid rgba(245, 158, 11, 0.55);
}

#btnJhHeaderStop {
  display: none !important;
}

.jh-reels-viewport {
  background: var(--jh-surface-cream);
}

.jh-reel-slide,
.jh-card-stage,
.jh-outgoing-ghost {
  background: var(--jh-surface-cream);
}

.jh-card-stage {
  min-height: 100dvh;
  padding: calc(16px + var(--jh-safe-top)) 16px calc(32px + var(--jh-safe-bottom));
}

.jh-hook-title,
.jh-sec-heading,
.jh-drawer-title {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.jh-hook-title {
  font-size: clamp(1.2rem, 4.3vw, 1.42rem);
  font-weight: 800;
  color: #0F172A;
  line-height: 1.44;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
  padding-right: 44px;
  transition: opacity 0.3s ease, background-color 0.25s ease;
}

.jh-vibe-badge {
  background: #CCFBF1;
  color: #0F766E;
  border-color: #99F6E4;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
}

/* CALM, BREATHABLE CONCEPT CARDS (NO VISUAL CROWDING OR HEAVY BORDERS) */
.jh-content-section {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 13px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
  transition: opacity 0.32s ease, transform 0.32s ease, box-shadow 0.28s ease, border-color 0.28s ease;
}

.jh-sec-story {
  background: #FFFFFF;
  border-left: 4px solid #0D9488;
}

.jh-sec-hitch {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-left: 4px solid #F59E0B;
}

.jh-sec-extra {
  background: #FFFFFF;
  border: 1px solid #E2E8F0;
  border-left: 4px solid #6366F1;
}

/* LOW-PROFILE SECTION SUBTITLES (DE-EMPHASIZED SO EYES GO STRAIGHT TO THE IDEA) */
.jh-sec-heading {
  font-size: 0.78rem;
  font-weight: 600;
  color: #64748B;
  letter-spacing: 0.01em;
  line-height: 1.36;
  margin-bottom: 8px;
}

/* BITE-SIZED SENTENCE CHUNKS WITH GENEROUS LINE & WORD SPACING */
.jh-sec-para {
  font-size: 1.05rem;
  color: #1E293B;
  line-height: 1.76;
  letter-spacing: 0.008em;
  word-spacing: 0.03em;
  margin-bottom: 11px;
}

.jh-sec-para:last-child {
  margin-bottom: 0;
}

/* SENTENCE-LEVEL + WORD-LEVEL GUIDED READING TRACKER (ZERO SPOKEN-WORD BOX CLUTTER) */
.jh-tts-sentence {
  display: inline;
  border-radius: 6px;
  transition: background-color 0.18s ease;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

.jh-tts-sentence.jh-sentence-active {
  background-color: rgba(254, 243, 199, 0.68);
  padding: 2px 3px;
  margin: 0 -3px;
}

.jh-tts-word {
  padding: 0;
  margin: 0;
  border-radius: 4px;
}

.jh-tts-word.jh-word-spoken {
  color: #334155;
  background-color: transparent !important;
  box-shadow: none !important;
}

.jh-tts-word.jh-word-active {
  background: #FDE68A;
  color: #0F172A !important;
  font-weight: 700;
  border-radius: 5px;
  padding: 1px 4px;
  margin: 0 -2px;
  box-shadow: 0 1px 5px rgba(245, 158, 11, 0.35), 0 0 0 1.5px rgba(245, 158, 11, 0.65);
}

/* GUIDED FOCUS SPOTLIGHT MODE WHILE VOICE IS PLAYING */
body.jh-audio-playing .jh-hook-title:not(.jh-block-active) {
  opacity: 0.55;
}

body.jh-audio-playing .jh-content-section:not(.jh-block-active),
body.jh-audio-playing .jh-curiosity-box:not(.jh-block-active) {
  opacity: 0.44;
}

.jh-content-section.jh-block-active,
.jh-curiosity-box.jh-block-active {
  opacity: 1 !important;
  background: #FFFFFF;
  border-color: #F59E0B;
  box-shadow: 0 8px 24px rgba(245, 158, 11, 0.14), 0 0 0 2px #F59E0B;
}

/* ALWAYS-OPEN KEY TAKEAWAY CARD (ZERO "TAP TO REVEAL" FRICTION) */
.jh-curiosity-box {
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  border-left: 4px solid #10B981;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 14px;
  cursor: default;
  transition: opacity 0.32s ease, box-shadow 0.28s ease;
}

.jh-curiosity-tap-hint {
  display: none !important;
}

.jh-curiosity-q {
  font-size: 0.95rem;
  font-weight: 700;
  color: #065F46;
  line-height: 1.5;
}

.jh-curiosity-a {

olio/ai-companion-audio/audio/anondo/quotes/quote_3.mp3"}, {"text": "On Pass 1 of listening, silence the inner depth-inspector: catch the 1-sentence headline first, and your 4 working-memory slots stay effortless.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/quotes/quote_4.mp3"}, {"text": "After 6 PM, hang up the family-rescuer uniform. Sing from meaning, climb, laugh, and savor deeply roasted craft.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/quotes/quote_5.mp3"}, {"text": "Remorse has already taught every lesson from 11, 17, 26, and 30. Drop Buddha's Second Arrow—your bail is 100% paid.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/quotes/quote_6.mp3"}], "days": [{"day": 1, "phase": "House-Money Era", "title": "Closing the Survival Decade & Answering the College Diary Oath", "sub": "The Torn College Diary Oath Is Answered • Pass-1 Headline Catch (Zero Sentence-2 Stalling) • Hindi Sufi Masterpiece", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_1.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "The Torn College Diary Oath Is Answered", "detail": "Back in Jadavpur and early Oracle, a 22-year-old boy cried into thick diaries begging his Future Self to hold onto his dreams because an unmedicated 4-slot working memory could not carry survival, grief, and big dreams at once. Look around at 33: Google L5 Senior SWE, ₹2.61 Cr+ shield, KORTEX external memory, and Ma's Kalyani live. The survival decade (2016–2026) is officially won—what remains from that boy's letter is simply the unhurried joy, music, and play he had to put on ice.", "prompt": "Gemini, I want to celebrate closing my 2016–2026 survival decade at 33—reflect back what that 22-year-old boy in Jadavpur would feel seeing today's reality.", "followup_prompt": "Gemini, ask me one open question to uncover which playful, non-duty dream from my early twenties wants the microphone first this month.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_1_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Pass-1 Headline Catch (Zero Sentence-2 Stalling)", "detail": "Comprehension lag happens when your first-principles instinct pauses on Sentence 2 to ask 'Wait, why does that work?' while the speaker is already on Sentence 7. Today's drill: ask Gemini to read a dense 75-second spoken argument on why cities or distributed systems fail, keep your inner critic silent until the final word, and repeat back only the 1-sentence core thesis ('kehna kya chahta hai').", "prompt": "Gemini, speak a dense, interesting 75-second mini-talk with one main thesis and three supporting mechanisms—do not use bullet points, speak it like a natural monologue so I can practice Pass-1 Headline Listening.", "followup_prompt": "Gemini, here is my 1-sentence headline of what you meant and how you structured it—grade my accuracy and tell me if I missed any subtle turn.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_1_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Hindi Sufi Masterpiece: 'Kun Faya Kun' (A.R. Rahman & Irshad Kamil)", "detail": "Listen with eyes closed on Pass 1 without grading notes. Notice Irshad Kamil's startling couplet: 'Jab kahin pe kuch nahi bhi nahi tha, wahi tha, wahi tha'—when even 'nothingness' itself did not exist, Consciousness was there. Notice how Rahman starts with bare harmonium and dargah stillness before layering guitars.", "prompt": "Gemini, play 'Kun Faya Kun' on YouTube Music.", "followup_prompt": "Gemini, unpack the deeper Sufi philosophy behind 'Jab kahin pe kuch nahi bhi nahi tha' and how Rahman builds emotional bhaavna from silence to chorus.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_1_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Earl Miller's Theta-Gamma Working Memory (Why Humans Have Exactly ~4 Slots)", "detail": "MIT neuroscientist Earl Miller discovered why human working memory caps at ~4 items: individual memories ride on fast gamma oscillations (~40 Hz) nested inside slower theta brainwaves (~4–8 Hz)—and only about 4 gamma bursts fit inside a single theta cycle before phase interference scrambles them!", "prompt": "Gemini, explain Earl Miller's theta-gamma phase-coding model of the 4-slot working memory limit like two physicists at a whiteboard.", "followup_prompt": "Gemini, connect that biological phase limit to why offloading open loops into KORTEX immediately makes thinking feel twice as sharp.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_1_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "90% '20% Tourist Pass' vs. 1 Chosen '100% Deep Dive'", "detail": "Your depth standard is a superpower on one crown-jewel problem and a trap when applied to routine emails, minor PRs, or admin errands. Today, crown ONE single piece of craft for your 100% Deep Dive, and stamp an explicit '20% Tourist Pass' (skim, decide in 3 minutes, ship) on everything else.", "prompt": "Gemini, help me pick my single '100% Deep Dive' bet for today and ruthlessly stamp a '20% Tourist Pass' on two minor tasks trying to steal my RAM.", "followup_prompt": "Gemini, give me a playful 10-second rule to catch myself if I start polishing a Tourist-Pass task to perfection.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_1_ag_4.mp3"}]}, {"day": 2, "phase": "House-Money Era", "title": "First-Press Abundance & Catching the Spoken Headline", "sub": "First-Press Lemon Law: Toss the ₹4 Bitter Pith • Holding 3 Auditory Anchors in Cowan's 4-Slot Buffer • Rabindra Sangeet", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_2.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "First-Press Lemon Law: Toss the ₹4 Bitter Pith", "detail": "Pressing a fresh Gondhoraj or Kagzi lemon once yields 88% of its sweet aromatic juice in two seconds. Crushing and twisting the rind six times to rescue 35 paise of liquid only releases bitter white pith that ruins the entire glass. With L5 Senior SWE compensation and ₹2.61 Cr+ working quietly in the background, eating bruised fruit first or hesitating on your own comfort is an obsolete 1990s reflex.", "prompt": "Gemini, give me a witty real-world check on where people accidentally 'squeeze bitter lemon pith' in time, money, or engineering—and offer one First-Press upgrade for today.", "followup_prompt": "Gemini, suggest one effortless quality-of-life treat or upgrade today where I take the sweet 88% first press and toss the rest guilt-free.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_2_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Holding 3 Auditory Anchors in Cowan's 4-Slot Buffer", "detail": "Instead of trying to transcribe every word in your head, great listeners mentally tag just three spatial anchors on their fingers (Thumb = Premise, Index = Tension/Twist, Middle = Resolution). Let Gemini tell a short historical or scientific twist story aloud while you hold only those three anchors.", "prompt": "Gemini, tell me a vivid 60-second true story from science or cinema history that has a clear setup, an unexpected plot twist, and a counterintuitive lesson—then pause for my 3-anchor recap.", "followup_prompt": "Gemini, test me on one subtle detail from the middle of your story to sharpen my auditory recall.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_2_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Rabindra Sangeet: 'Majhe Majhe Tobo Dekha Pai, Chirodin Keno Pai Na'", "detail": "Tagore asks a question every creative BFS mind knows intimately: 'Majhe majhe tobo dekha pai, chirodin keno pai na / Keno megh ashe hridoyo-akashe, tomare dekhite dey na?' (I catch glimpses of You now and then—why not forever? Why does a cloud drift across the sky of my heart and hide You from my eyes?). Listen to how the melody expresses tender longing on 'Kshanik aloke ankhir poloke tomay jobe pai dekhite / Ohe harai harai soda bhoy hoy, haraiya feli chokite'.", "prompt": "Gemini, play 'Majhe Majhe Tobo Dekha Pai' on YouTube Music.", "followup_prompt": "Gemini, unpack the poetic and psychological meaning of 'Majhe Majhe Tobo Dekha Pai' and which raga gives it that bittersweet pull.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_2_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Alan Turing's Final Masterpiece: How Leopard Spots & Zebra Stripes Compute Themselves", "detail": "Two years before his death, Alan Turing asked how a symmetrical sphere of identical embryo cells breaks symmetry into fingers, leopard spots, and spirals—inventing reaction-diffusion morphogenesis, where just two diffusing chemicals (a local activator and a faster-spreading inhibitor) spontaneously paint complex nature.", "prompt": "Gemini, walk me through the intuition of Turing's 1952 reaction-diffusion equations—why must the inhibitor diffuse faster than the activator for patterns to emerge?", "followup_prompt": "Gemini, where else in nature, neuroscience, or urban dynamics do Turing instabilities show up unexpectedly?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_2_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "2-Minute Floor-Up Zorba Reset (Left Arch Dome + 30s Dead Hang)", "detail": "Remember the exact kinetic chain from your Oct 27 physio blueprint: left foot arch -> left knee -> left waist QL -> right shoulder roll. Stand barefoot for 90 seconds right now: gently dome your left foot arch keeping the big toe grounded, hang for 30 seconds (or open your chest wide), and let your belly and jaw go completely soft.", "prompt": "Gemini, talk me through a calm, real-time 90-second barefoot Floor-Up Reset from my left foot arch up to my shoulders and jaw.", "followup_prompt": "Gemini, why does softening the upper belly and dropping the shoulders immediately tell the vagus nerve that fight-or-flight is over?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_2_ag_4.mp3"}]}, {"day": 3, "phase": "Clarity & Flow", "title": "1-Sentence Map First & Pink Floyd's 'Time'", "sub": "Speak the 1-Sentence Map Out Loud First • Subtext & Emotional Frame Listening (Beyond Literal Words) • English Progressive Classic", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_3.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Speak the 1-Sentence Map Out Loud First", "detail": "Your thoughts form as a simultaneous 3D web of connections, while human speech is a narrow single-file line of words. Whenever you dive straight into details, holding the 3D map silently in RAM crowds your speech. Putting one clean structural headline into the air first ('There are three parts here—let's look at the first') frees your working memory instantly.", "prompt": "Gemini, give me a complex engineering or philosophical topic and coach me as I explain it starting with a crisp 1-sentence structural map.", "followup_prompt": "Gemini, critique how cleanly my headline separated the big picture from the weeds, and give me one sharper phrasing.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_3_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Subtext & Emotional Frame Listening (Beyond Literal Words)", "detail": "In leadership and relationships, people rarely state their real fear in plain words—a territorial teammate arguing about 'code formatting' is usually saying 'Don't erase my status'. Today, practice hearing the hidden emotional question underneath a speaker's literal words.", "prompt": "Gemini, speak a realistic 45-second monologue from a stressed colleague or friend who sounds defensive on the surface, and let me identify both their literal claim and their unspoken underlying need.", "followup_prompt": "Gemini, how accurate was my read, and what 1-sentence reply would disarm their defensiveness immediately?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_3_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "English Progressive Classic: Pink Floyd — 'Time' (Lyrics as a Wake-Up Bell)", "detail": "Roger Waters wrote 'Time' at age 28 when he suddenly realized he was no longer preparing for life—life was already happening right now ('Ticking away the moments that make up a dull day... Ten years have got behind you, no one told you when to run'). Listen to David Gilmour's soaring guitar solo right after the verse—pure emotional storytelling without a single word.", "prompt": "Gemini, play 'Time' by Pink Floyd on YouTube Music.", "followup_prompt": "Gemini, break down why the lyrics and Gilmour's solo in 'Time' hit even deeper at 33 once your survival decade is behind you.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_3_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Amal Kumar Raychaudhuri & The Equation That Proved Spacetime Singularities", "detail": "Working in Kolkata in the 1950s under resource constraints, Presidency College physicist Amal Kumar Raychaudhuri derived the geometric equation showing how nearby trajectories focus under gravity—handing Roger Penrose and Stephen Hawking the exact mathematical key to prove black-hole and Big Bang singularities.", "prompt": "Gemini, explain the physical intuition of the Raychaudhuri equation (expansion, shear, vorticity) without burying the beauty in index gymnastics.", "followup_prompt": "Gemini, tell me about Raychaudhuri's legendary teaching style in Kolkata and how Penrose first encountered his paper.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_3_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "The 15-Second '# NEXT:' Breadcrumb Before Standing Up", "detail": "Break re-entry dread happens only when you walk away on a fuzzy, heavy problem. Before closing or half-closing your laptop today, type one ridiculously stupid 10-second move right at the cursor (`# NEXT: print tensor shape on line 88`), unclench your stomach, and grab water or your ukulele.", "prompt": "Gemini, ask me what I'm working on right now and help me shrink my '# NEXT:' cursor breadcrumb down to a brainless 10-second action before my next break.", "followup_prompt": "Gemini, suggest a fun 5-minute sensory break (no phone feed!) that refreshes my eyes and hands.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_3_ag_4.mp3"}]}, {"day": 4, "phase": "Clarity & Flow", "title": "Dropping Buddha's Second Arrow & Kabir Suman's Poetry", "sub": "Buddha's Second Arrow & Full Bail Amnesty • Bilingual Rapid-Switch Listening (Bengali <-> English) • Bengali Modern Anthem", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_4.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "Buddha's Second Arrow & Full Bail Amnesty", "detail": "In the Sallatha Sutta, Gautama Buddha distinguishes the First Arrow (an unavoidable pain or unmentored mistake) from the Second Arrow—firing shame at yourself years later for the exact same memory. Childhood Inattentive ADHD—not noticing a rickshaw driver's cut finger or forgetting a flatmate's plate—was working-memory tunnel vision, never 'dirt in the mind'. And every youthful mistake at 11, 17, 26, or 30 has already taught its lesson in full. Cruel men never ache with remorse; your bail is 100% paid.", "prompt": "Gemini, unpack Buddha's Second Arrow parable in plain, grounded English and explain why remorse that has already changed behavior has zero remaining utility.", "followup_prompt": "Gemini, give me a crisp 1-line mental stamp I can use whenever my brain tries to reopen an old closed archive.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_4_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Bilingual Rapid-Switch Listening (Bengali <-> English)", "detail": "Real conversations in Kolkata and Hyderabad jump fluidly between rapid colloquial Bangla and technical or cultural English. Practicing zero-lag comprehension across code-switching keeps your auditory buffer nimble and relaxed.", "prompt": "Gemini, deliver a lively 60-second bilingual Kolkata adda-style reflection mixing natural Bengali and English about cinema, food, and modern AI—then ask me to summarize the core argument in one crisp English sentence.", "followup_prompt": "Gemini, point out the sharpest metaphor you used in that passage and let's riff on it.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_4_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Bengali Modern Anthem: Kabir Suman — 'Tomake Chai'", "detail": "In 1992, Kabir Suman revolutionized Bengali music with one acoustic keyboard/guitar and vivid Kolkata street poetry—turning everyday coffee cups, tram lines, and unspoken longing into high literature. Listen to how conversational chest-voice phrasing makes every word land like an intimate letter.", "prompt": "Gemini, play 'Tomake Chai' by Kabir Suman on YouTube Music.", "followup_prompt": "Gemini, walk me through the most iconic lyrical images in 'Tomake Chai' and how Suman proved conversational emotion beats vocal shouting.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_4_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Ilya Prigogine's Dissipative Structures: Why Living Minds Thrive Far From Equilibrium", "detail": "Closed systems decay toward dead maximum entropy, yet living cells, hurricanes, and creative minds grow *more* ordered over time. Nobel laureate Ilya Prigogine proved why: open systems driven far from equilibrium self-organize into 'dissipative structures' by importing free energy and exporting entropy.", "prompt": "Gemini, unpack Prigogine's dissipative structures and Bénard convection cells—how does order emerge spontaneously at a critical energy threshold?", "followup_prompt": "Gemini, play with that idea as a metaphor for creative breakthroughs after periods of restlessness.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_4_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Counting 'Doors & Counters' (Zero-Rush Transition Physics)", "detail": "A top-down BFS mind pictures only 'home -> destination = 5 minutes' and erases elevators, 4th-basement valet parking, reception desks, and corridors. Whenever heading out today, count the physical doors and counters in between (+5 mins each) and take the boring default path so you arrive unhurried like a king.", "prompt": "Gemini, help me run a quick 'Doors & Counters' backward check on my next outing or appointment so I walk in 5 minutes early with a cool head.", "followup_prompt": "Gemini, why does removing last-minute route experiments right before fixed appointments save so much nervous-system energy?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_4_ag_4.mp3"}]}, {"day": 5, "phase": "Clarity & Flow", "title": "Jadavpur Curiosity Fire & 'Iktara' Morning Air", "sub": "WBJEE Rank 222 & The Quiet Fire Underneath • Catching the Hidden Unstated Assumption • Hindi Poetic Soul", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_5.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "WBJEE Rank 222 & The Quiet Fire Underneath", "detail": "In early 2011, right through heartbreak and zero external coaching scaffolding, you still topped your school and region with WBJEE Rank 222 for Jadavpur EE. That calm, deep-focus fire never belonged to fear or strictness—it belonged to your own native curiosity when your mind locks onto something real.", "prompt": "Gemini, let's talk about why intrinsic curiosity produces cleaner breakthroughs for a high-IQ ADHD mind than harsh self-policing ever did.", "followup_prompt": "Gemini, ask me about one problem or craft right now that sparks that same effortless Jadavpur-era curiosity without any career pressure.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_5_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Catching the Hidden Unstated Assumption", "detail": "Every persuasive speech rests on one unstated premise that the speaker hopes you swallow automatically. Listening like Richard Feynman means catching the headline on Pass 1 and spotting that single load-bearing assumption without losing the flow.", "prompt": "Gemini, give me a persuasive-sounding 60-second pitch on technology, economics, or human behavior that contains one subtle unstated assumption—let me listen once and spot the hidden premise.", "followup_prompt": "Gemini, evaluate my catch and show me how questioning that single premise flips the conclusion.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_5_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Hindi Poetic Soul: 'Iktara' (Amit Trivedi & Javed Akhtar — Wake Up Sid)", "detail": "Listen to Kavita Seth's earthy voice over a hypnotic acoustic guitar groove: 'Sun raha hai sudh-budh khoke koi main kahani, poori kahani hai kya kise hai pata?'—listening so absorbedly to a story whose ending nobody knows yet. Notice how effortlessly the melody breathes in a comfortable middle register.", "prompt": "Gemini, play 'Iktara' from Wake Up Sid on YouTube Music.", "followup_prompt": "Gemini, unpack Javed Akhtar's Urdu-Hindi metaphors in 'Iktara'—especially 'gunja sa hai koi iktara'—and why its chord progression feels like fresh morning air.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_5_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Whole-Brain Connectomics: From the 139,255-Neuron FlyWire Fruit Fly to Mammalian Minds", "detail": "Mapping every single neuron and 50 million synapses of the adult Drosophila brain (FlyWire) revealed that an entire sensorimotor intelligence fits in a poppy-seed volume—raising a profound question: how much of intelligence lives in static wiring topology versus neuromodulators and active dynamics?", "prompt": "Gemini, what were the three biggest surprises neuroscientists discovered once the full Drosophila connectome was mapped and simulated?", "followup_prompt": "Gemini, what remains missing even if you have 100% of a brain's static synaptic adjacency matrix?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_5_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "5-Minute Zero-Utility Guitar or Ukulele Strum", "detail": "Pick up your guitar or ukulele right within arm's reach—no tutorial goal, no recording pressure. Strum three warm chords slowly, close your eyes, and hum a phrase on 'Mmmm' feeling the wooden body vibrate against your chest.", "prompt": "Gemini, give me a sweet, easy 3- or 4-chord progression on ukulele or acoustic guitar that sounds instantly cinematic and soothing.", "followup_prompt": "Gemini, suggest one classic Bengali, Hindi, or English chorus I can hum effortlessly over those exact chords.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_5_ag_4.mp3"}]}, {"day": 6, "phase": "Clarity & Flow", "title": "Cosmic Parent, Divine Child & Leonard Cohen's Crack of Light", "sub": "Retiring the Internal 'Stalin' -> Cosmic Parent & Divine Child • Hindi/Urdu Conversational Nuance & Tone Listening • English Poetic Masterwork", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_6.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "Retiring the Internal 'Stalin' -> Cosmic Parent & Divine Child", "detail": "When you lost Baba at 23 with zero mentorship manual, your brain had to invent a harsh internal drill-sergeant just to keep the family plane in the air. Today, automated external containers—KORTEX, Direct-Growth index/arbitrage pipelines, and Ma's care pod—hold the Parent role reliably. That frees your conscious mind to step into Nietzsche's third metamorphosis and Ramakrishna's Santan Bhava: the fearless, curious Child who builds and plays from 'Sacred Yes' rather than self-whipping.", "prompt": "Gemini, contrast Nietzsche's Camel, Lion, and Child with Bengali Santan Bhava—why is the Child the highest post-mastery stage rather than immaturity?", "followup_prompt": "Gemini, point out one place today where I can hand the 'Camel' load to an external system and approach the afternoon as the curious Child.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_6_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Hindi/Urdu Conversational Nuance & Tone Listening", "detail": "When listening to rapid Hindi or Urdu—whether in Gulzar's dialogues, Hyderabad conversations, or North Indian storytelling—comprehension blooms when you track cadence and key idioms ('kehne ka matlab', 'darasal', 'bawaajood') rather than translating word by word.", "prompt": "Gemini, speak a natural, expressive 60-second story in everyday conversational Hindi-Urdu with two rich idioms, then pause so I can recap the gist and tone in English.", "followup_prompt": "Gemini, unpack those two Hindi/Urdu idioms you used so they lock permanently into my ear.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_6_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "English Poetic Masterwork: Leonard Cohen — 'Anthem' ('There Is a Crack in Everything')", "detail": "Leonard Cohen spent years rewriting 'Anthem' in a monastery before arriving at his immortal chorus: 'Ring the bells that still can ring / Forget your perfect offering / There is a crack, a crack in everything / That's how the light gets in.' Pure sonic medicine against perfectionism.", "prompt": "Gemini, play 'Anthem' by Leonard Cohen on YouTube Music.", "followup_prompt": "Gemini, explore the backstory and Zen philosophy behind Leonard Cohen's 'Forget your perfect offering' and how his low baritone carries so much gravity.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_6_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Satyendra Nath Bose's 'Mistake' That Birthed Quantum Statistics in Dhaka", "detail": "In 1924, when Satyendra Nath Bose counted photon states in a way classical probability declared 'wrong' (treating identical quanta as fundamentally indistinguishable) and mailed his rejected 4-page paper directly to Einstein, Einstein immediately translated it into German and predicted Bose–Einstein condensates.", "prompt": "Gemini, explain the exact coin-flip counting difference between classical Maxwell–Boltzmann particles and indistinguishable Bose–Einstein bosons.", "followup_prompt": "Gemini, tell me the story of Bose's meeting with Einstein and Dirac—and why Bose never bothered applying for a PhD.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_6_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "The 'Ugly Garbage' 2-Minute Starter Motor Trick", "detail": "High-IQ perfectionism freezes on a blank page, while a high-IQ brain *loves* fixing bad drafts. If anything feels sticky to start today, set 120 seconds to write the dumbest, ugliest 4-line caveman sketch possible—your inner architect will wake up automatically to clean it.", "prompt": "Gemini, if there is one doc, design, or message I've been putting off, let me dictate a messy 3-sentence 'ugly garbage' voice dump right now so you can structure v0.", "followup_prompt": "Gemini, turn my raw ramble into a clean, sharp skeleton while keeping my voice.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_6_ag_4.mp3"}]}, {"day": 7, "phase": "Clarity & Flow", "title": "Structural Calm for Family & Fossils' Sonic Catharsis", "sub": "Liberating Didi Structurally Without Absorbing Her Weather • Dense Technical Design Pitch Compression • Bengali Rock & Existential Fire", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_7.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Liberating Didi Structurally Without Absorbing Her Weather", "detail": "Didi has zero ADHD—she is naturally sharp, independent, materialistic, and loves warm rapport with everyone, yet years of marital depression and fights with Pratik froze her into emotional numbness and survival rudeness. You can help liberate her structurally—moving the household into the clean 3BHK and keeping Ma's care pod independent—while keeping a calm glass window between her defensive armor and your nervous system.", "prompt": "Gemini, help me think through one calm, zero-argument structural move that eases Didi's household pressure while keeping my own emotional boundaries 100% intact.", "followup_prompt": "Gemini, give me one warm, non-judgmental line that appeals to Didi's sharp, comfort-loving core without getting pulled into Pratik's drama.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_7_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Dense Technical Design Pitch Compression", "detail": "In staff/senior architecture reviews, rambling speakers bury simple system bottlenecks under five layers of jargon. Practice letting noisy jargon wash past while locking onto just three signals: Input Constraint, Core Bottleneck, and Trade-off Chosen.", "prompt": "Gemini, roleplay an engineer giving a slightly wordy 75-second verbal pitch for a distributed AI service—let me listen and play back the exact bottleneck and trade-off in two crisp sentences.", "followup_prompt": "Gemini, tell me which piece of noise I smartly ignored and whether any real risk slipped past my filter.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_7_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Bengali Rock & Existential Fire: Fossils (Rupam Islam) — 'Hasnuhana' or 'Ekla Ghor'", "detail": "Listen to how Rupam Islam fuses raw Western rock chord progressions with razor-sharp Bengali literary vocabulary in 'Ekla Ghor' ('Ei ekla ghor amar desh, amar ekla thakar obbhesh / Bhabi kichhutei bhabbo na tomar kotha, boba telephone-er pashe boshe'). Track how quiet arpeggiated verses explode into cathartic release.", "prompt": "Gemini, play 'Ekla Ghor' by Fossils on YouTube Music.", "followup_prompt": "Gemini, dissect the lyrical imagery and chord dynamics of 'Ekla Ghor'—how did Fossils reinvent modern Bengali songwriting?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_7_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Uber H3 & Why Hexagons Beat Squares for Planetary Spatial Indexing", "detail": "On a grid of squares, diagonal neighbors sit $\\sqrt{2}$ farther away than edge neighbors, distorting flow and radius queries. On a hexagonal grid (Uber H3), every neighbor's center is equidistant—and projecting an icosahedron onto Earth lets 64-bit integer IDs encode multi-resolution geography in $O(1)$ bit-shifts.", "prompt": "Gemini, walk me through how Uber H3 handles the 12 unavoidable pentagons on an icosahedron and why aperture-7 hierarchy is so clever.", "followup_prompt": "Gemini, what other engineering domains secretly become trivial once you pick the right coordinate Dual or spatial index?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_7_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Warm-to-Cool Rebooting Shower (The Gear-Shift Ritual)", "detail": "Hyperfocus + metphen can leave your mind revving in work gear long after your body is tired. Use an unhurried 8-minute warm shower on your neck and upper back followed by 20–30 seconds of cool water as your physical clutch pedal between work mode and free evening play.", "prompt": "Gemini, explain the physiology of why a warm-to-cool shower resets autonomic tone and clears mental residue better than scrolling.", "followup_prompt": "Gemini, help me pair tonight's post-shower reset with a great meal and song so my evening feels like a mini-vacation.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_7_ag_4.mp3"}]}, {"day": 8, "phase": "Unburdened Presence", "title": "6 PM Off-Duty Caretaker Switch & Gulzar's Gentle Wisdom", "sub": "The 6 PM Off-Duty Caretaker Switch • Storyteller's Pacing: Listening for 'Kaise Keh Raha Hai' • Hindi Gulzar Magic", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_8.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "The 6 PM Off-Duty Caretaker Switch", "detail": "Financial seva is ensuring Ma has a safe sanctuary, medical care, domestic help, and Kalyani—which you have already built at 110%. Emotional fusion—absorbing someone else's boredom, panic, or marital-stress weather after 6 PM—helps nobody and drains your own life force. Hanging up the rescuer coat in the evening is healthy adult differentiation, allowing space for your own laughter, guitar, and social life.", "prompt": "Gemini, explain family-systems 'differentiation of self' (Murray Bowen) in plain English—how do you love family deeply while keeping zero emotional fusion?", "followup_prompt": "Gemini, help me pick one fun, strictly non-caretaker evening plan after 6 PM today.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_8_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Storyteller's Pacing: Listening for 'Kaise Keh Raha Hai'", "detail": "Great speakers persuade not just through what they say ('kehna kya chahta hai'), but *how* they pace contrast, silence, and concrete imagery ('kaise keh raha hai'). Today, listen specifically for rhetorical structure.", "prompt": "Gemini, deliver a captivating 60-second spoken miniature in the style of a great essayist—using a concrete sensory opening, a sharp contrast, and a quiet landing—and let me reverse-engineer your three moves.", "followup_prompt": "Gemini, give me a 30-second prompt where I try that exact same three-move speaking rhythm aloud.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_8_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Hindi Gulzar Magic: 'Tujhse Naraz Nahi Zindagi, Hairaan Hoon Main' (Masoom)", "detail": "Only Gulzar could draw the distinction so gently: 'I am not angry at you, Life—I am simply astonished and worn out watching your twists.' Listen to Anup Ghoshal / Lata Mangeshkar's feather-light delivery over R.D. Burman's minimal rhythm—zero vocal strain, 100% bhaavna.", "prompt": "Gemini, play 'Tujhse Naraz Nahi Zindagi' on YouTube Music.", "followup_prompt": "Gemini, unpack every couplet of Gulzar's 'Tujhse Naraz Nahi Zindagi'—especially 'Muskuraye toh muskurane ke karz utaarne honge'—and why that line speaks to every caretaker.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_8_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Agentic Knowledge Graphs vs. Ad-Hoc 'Structure-Aware RAG' Rube Goldberg Machines", "detail": "When engineers bolt regex table-parsers, custom row-block chunkers, and 10 sequential metadata filter probes onto flat vector RAG, they are accidentally reinventing a slow, lossy Knowledge Graph inside a search index—whereas explicit typed edges + an in-memory inverted index answer multi-hop relational queries in $<1\\text{ ms}$.", "prompt": "Gemini, let's spar on the exact theoretical boundary where flat vector embeddings fail (compositional multi-hop & negation) and explicit graph topology wins.", "followup_prompt": "Gemini, help me phrase this insight into a memorable 60-second opening hook for a conference talk.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_8_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Single-Arm Suitcase Carry & Unapologetic Physical Presence", "detail": "Carrying weight in one hand at a time forces the opposite QL and hip stabilizers to lock your pelvis level naturally—and walking tall with wide, relaxed shoulders and slow steps projects grounded male gravity regardless of height.", "prompt": "Gemini, coach me through a quick 3-set Single-Arm Suitcase Carry + Scapular Pull micro-session and why unilateral balance fixes asymmetrical waist tension.", "followup_prompt": "Gemini, share one crisp observation on why relaxed, unhurried movement signals far more confidence than rigid posture.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_8_ag_4.mp3"}]}, {"day": 9, "phase": "Unburdened Presence", "title": "Equal Playful Romance & Reclaiming 'Zara Zara' in Warm Chest Voice", "sub": "Equal Warmth: Dropping the Therapist Chair in Dating • Eyes-Closed Narrative Cinema (Pure Auditory Visualization) • Reclaiming 'Zara Zara' with the 3-Pass Meaning-First Method", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_9.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Equal Warmth: Dropping the Therapist Chair in Dating", "detail": "After 10 years of being the steady solver for family, it is easy to slip into 'understanding therapist' mode on dates while hiding your own playful desires. Real romantic electricity happens between two equals bantering at eye level—where you get to feel desired, teased, and held too.", "prompt": "Gemini, roleplay a witty, playful coffee date conversation with me and flag the exact second I slip into caretaker or therapist mode.", "followup_prompt": "Gemini, show me how to pivot that same moment into light teasing and unapologetic personal taste instead.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_9_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Eyes-Closed Narrative Cinema (Pure Auditory Visualization)", "detail": "Reading text uses visual cortex slots; listening with eyes closed frees your visual cortex to render a live movie scene of what the speaker is describing—dramatically boosting retention without effort.", "prompt": "Gemini, ask me to close my eyes, then narrate a richly detailed 60-second scene—from old Varanasi ghats, Santiniketan monsoon rain, or an orbital spacewalk—and afterwards quiz me on three sensory details.", "followup_prompt": "Gemini, how did picturing the scene as a movie affect what stayed effortlessly in memory?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_9_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Reclaiming 'Zara Zara' with the 3-Pass Meaning-First Method", "detail": "Today, listen to Bombay Jayashri's original 'Zara Zara' (or ' Vaseegara') not as a pitch test, but through your 3-Pass Meaning-First lens: close your eyes, feel the monsoon breathiness of Harris Jayaraj's flute intro, and notice how softly Jayashri whispers the opening verse in relaxed chest voice.", "prompt": "Gemini, play 'Zara Zara Behekta Hai' by Bombay Jayashri on YouTube Music.", "followup_prompt": "Gemini, guide me through singing just the first four lines of 'Zara Zara' dropped 2–3 semitones into my comfortable baritone key, focusing 100% on scene and breath.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_9_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "John von Neumann's Self-Replicating Universal Constructor (6 Years Before DNA's Structure!)", "detail": "In 1948—five years before Watson, Crick, and Franklin unveiled the DNA double helix—John von Neumann proved mathematically that any self-replicating machine *must* split an inert symbolic tape (copied blindly without execution) from a universal constructor that reads and builds from it—predicting DNA + ribosomes from pure logic!", "prompt": "Gemini, walk me through von Neumann's brilliant resolution of the infinite-regress paradox in self-replicating automata.", "followup_prompt": "Gemini, how does that exact 'Passive Tape vs. Active Interpreter' split show up in modern LLM agent architectures?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_9_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "The 5-Need Interoception Sightline Check", "detail": "Deep flow mutes hunger, thirst, movement, play, and human connection until evening rebound hits. Do a 10-second physical sightline check right now: water/*chaas* beside the keyboard, high-protein fuel queued, and one 5-minute warm, zero-problem chat with a human today.", "prompt": "Gemini, run a quick, cheerful 30-second check across my 5 vanishing flow needs—fuel, hydration, posture, play, and a warm human hello.", "followup_prompt": "Gemini, give me a fun 1-liner I can ping a friend or colleague today just to share a laugh with zero agenda.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_9_ag_4.mp3"}]}, {"day": 10, "phase": "Unburdened Presence", "title": "Clean-Slate Romantic Reset & Tagore's Cosmic Wonder", "sub": "Clean-Slate Romantic Reset Across All Past Chapters • Steelmanning an Opposing Viewpoint in One Breath • Rabindra Sangeet Cosmic Wonder", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_10.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "Clean-Slate Romantic Reset Across All Past Chapters", "detail": "Dating exists to discover whether two nervous systems and life visions genuinely fit long-term. Most pairings aren't meant to become marriage—and stepping back honestly when compatibility isn't there is integrity, not a debt. Across every past chapter—whether Sanchita, Shruti, Anindita, or Ananya—the lessons are integrated and the slate is clean.", "prompt": "Gemini, reframe why honest incompatibility in dating is a normal, healthy filter rather than a moral failure on either side.", "followup_prompt": "Gemini, what are the three green flags of an easy, warm, non-rescue romantic dynamic for a creative 2e mind?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_10_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Steelmanning an Opposing Viewpoint in One Breath", "detail": "When someone says something you disagree with, the ADHD/high-IQ brain instantly starts drafting a rebuttal at Sentence 2—muting comprehension of Sentences 3–6. The cure is the 'Rapoport Steelman Game': listen solely to restate their case better than they did.", "prompt": "Gemini, argue a smart, provocative 60-second contrarian take on AI, art, or cities that I might half-disagree with—my job is to hold zero rebuttal until I steelman your exact case first.", "followup_prompt": "Gemini, rate my steelman from 1–10 before I share my actual counter-view.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_10_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Rabindra Sangeet Cosmic Wonder: 'Akash Bhora Surjo Tara, Bishwo Bhora Pran'", "detail": "Tagore fuses astrophysical awe with embodied presence: 'The sky is brimming with suns and stars, the cosmos is brimming with life—and right in the middle of it all, I have found my place; in wonder, therefore, my song awakens.' Pure Participatory Universe in melody.", "prompt": "Gemini, play 'Akash Bhora Surjo Tara' on YouTube Music.", "followup_prompt": "Gemini, unpack how Tagore connects cosmic scale with everyday sensory wonder ('ghashe ghashe pa felechi') in 'Akash Bhora Surjo Tara'.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_10_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Robert Axelrod's Prisoner's Dilemma Tournament: Why 'Nice, Forgiving, Clear & Provocable' Wins", "detail": "When political scientist Robert Axelrod pitted complex, sneaky game-theory algorithms against each other across repeated interactions, Anatol Rapoport's 4-line program 'Tit-for-Tat' beat every predator. Its four traits—Start Warm, Respond Clearly to Crossing, Forgive Quickly, Be Easy to Read—are a masterclass for human boundaries too.", "prompt": "Gemini, explain why sneaky 'defector' strategies beat everyone head-to-head yet still lose the overall Axelrod tournament ecosystem.", "followup_prompt": "Gemini, what happens in noisy real-world communication ('Generous Tit-for-Tat'), and how does that apply to leading engineering teams?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_10_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Royal Grooming & Aesthetic Zero-Hesitation", "detail": "Looking sharp in the mirror—a clean textured scissor-taper cut, sculpted jawline beard, great-fitting shirt, subtle fragrance—directly lifts baseline dopamine. Never wait for a 'special occasion' to take care of your own aesthetic craft.", "prompt": "Gemini, give me a sharp, 3-bullet barber brief for a Textured Scissor Taper + Natural Flow Top suited to thick wavy black hair and an angular short beard.", "followup_prompt": "Gemini, suggest one effortless smart-casual outfit color pairing that looks timeless at an artisanal Hyderabad cafe or evening gig.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_10_ag_4.mp3"}]}, {"day": 11, "phase": "Unburdened Presence", "title": "Expressive RAM Clearing & Coke Studio Raga Grooves", "sub": "Expressive RAM Clearing (Klein & Boals' Working-Memory Reset) • Numbers-in-Motion Listening (Back-of-the-Envelope Ear) • Coke Studio Fusion", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_11.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Expressive RAM Clearing (Klein & Boals' Working-Memory Reset)", "detail": "Cognitive psychologist Kitty Klein proved empirically that unexpressed emotional friction squats directly inside prefrontal working-memory slots—and putting raw, unfiltered truth into words measurably expands free mental bandwidth within minutes.", "prompt": "Gemini, give me a 2-minute judgment-free sounding board so I can dump any lingering annoyance or open loop from this week out of my head.", "followup_prompt": "Gemini, distill everything I just said into two sentences: what is 100% outside my job description, and what single tiny step closes the rest.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_11_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Numbers-in-Motion Listening (Back-of-the-Envelope Ear)", "detail": "When numbers fly by in spoken conversation—latencies, valuations, probabilities—trying to hold exact 6-digit figures jams working memory. Rounding instantly to orders of magnitude ('~30 million', '~20x gap') keeps all 4 slots free.", "prompt": "Gemini, speak a realistic 60-second scenario containing four or five real-world numbers and rates—let me practice rounding to clean orders of magnitude in my head and giving you the headline takeaway.", "followup_prompt": "Gemini, check my mental order-of-magnitude math and share one neat Fermi-estimation trick.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_11_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "Coke Studio Fusion: 'Pasoori' or Kabir's 'Mann Laago Mero Yaar Fakiri Mein'", "detail": "Listen to how Coke Studio layers traditional South Asian classical ragas and folk poetry over crisp modern basslines—turning centuries-old mystic lyrics into irresistible groove. Let your ears track just the bassline on Pass 1, then the vocal ornamentation (murki/khatka) on Pass 2.", "prompt": "Gemini, play 'Pasoori' by Ali Sethi and Shae Gill on YouTube Music.", "followup_prompt": "Gemini, break down the Punjabi-Urdu poetic meaning of 'Pasoori' and the raga scale giving that melody its hypnotic tension.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_11_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Karl Friston's Free Energy Principle & Active Inference", "detail": "Instead of viewing the brain as a passive camera waiting for inputs, predictive processing frames cortex as an active scientist constantly firing top-down predictions downward—where only *prediction error* (surprise) travels upward, and we either update our model (perception) or move our hands to make the prediction come true (action).", "prompt": "Gemini, give me an intuitive, equation-light walkthrough of Active Inference—how do perception and physical action minimize the exact same prediction error?", "followup_prompt": "Gemini, what is the strongest scientific critique of the Free Energy Principle being unfalsifiable, and where does it genuinely shine?", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_11_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "Bouldering / Swimming Flow: Thinking With Your Hands & Breath", "detail": "Rock climbing and swimming are pure embodied meditation for an ADHD mind—on a boulder wall or in the lane, you cannot ruminate about next month because your feet, grip, and breath demand 100% present-moment sensory geometry.", "prompt": "Gemini, compare why climbing a boulder route uses the exact same puzzle-solving joy as elegant systems design—minus screen fatigue.", "followup_prompt": "Gemini, give me one playful technique cue (like 'quiet feet / straight arms' in bouldering or 'long glide exhale' in swimming) to try on my next session.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_11_ag_4.mp3"}]}, {"day": 12, "phase": "Unburdened Presence", "title": "Exposing Counterfeit Adrenaline & Simon & Garfunkel Harmonies", "sub": "Exposing Low-Dopamine Counterfeit Adrenaline & Post-War Thaw • Listening Without Self-Monitoring in Warm Social Banter • English Acoustic Poetry", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_12.mp3", "games": [{"pillar": "covert_cbt", "short": "🌿 Covert CBT", "category": "🌿 Covert CBT & Effortless Reframe (1-in-2-Days)", "title": "Exposing Low-Dopamine Counterfeit Adrenaline & Post-War Thaw", "detail": "Soldiers rarely cry in the trenches; the heaviness surfaces only after peace is signed and the body realizes it is finally safe to thaw. Similarly, when an ADHD brain dips low on afternoon dopamine, it sometimes renders an 8K scary simulation just to squeeze out counterfeit adrenaline. Recognizing 'Ah, low dopamine—not real danger' cuts power to the movie in five seconds.", "prompt": "Gemini, walk me through the neuroscience of why peace after a 10-year survival sprint temporarily feels like melancholy or a quiet vacuum.", "followup_prompt": "Gemini, give me a 60-second sensory reset—water, posture, and music—that refills clean dopamine without fake urgency.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_12_ag_0.mp3"}, {"pillar": "listening_comp", "short": "🎧 Active Listening", "category": "🎧 Active Listening & Real-Time Comprehension Lab", "title": "Listening Without Self-Monitoring in Warm Social Banter", "detail": "In casual group banter or dates, comprehension drops if one RAM slot is busy asking 'What clever thing should I say next?' Dropping the performance monitor lets you catch tiny playful hooks right inside the other person's last four words.", "prompt": "Gemini, toss three realistic, slightly playful conversational remarks at me one by one so I can practice listening gently and riffing off your last phrase without pre-scripting.", "followup_prompt": "Gemini, highlight which reply felt the lightest, warmest, and most effortless.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_12_ag_1.mp3"}, {"pillar": "music", "short": "🎵 Song & Bhaavna", "category": "🎵 Multilingual Song Meaning, Bhaavna & Ear Curiosity", "title": "English Acoustic Poetry: Simon & Garfunkel — 'The Sound of Silence' or 'April Come She Will'", "detail": "Listen to two voices locked in parallel thirds and sixths over fingerpicked acoustic guitar—a masterclass in how chord harmony works ('Step 1 Root + Step 3') and how poetic compression paints an entire mood in two minutes.", "prompt": "Gemini, play 'The Sound of Silence' by Simon and Garfunkel on YouTube Music.", "followup_prompt": "Gemini, explain the vocal harmony intervals between Paul Simon and Art Garfunkel and the lyrical irony of 'people talking without speaking, people hearing without listening'.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_12_ag_2.mp3"}, {"pillar": "gk_inspiring", "short": "🔭 Frontier Wonder", "category": "🔭 High-IQ Polymathic Science, Math & Art", "title": "Riemann's Zeta Function & The Secret Music Connecting Prime Numbers", "detail": "Primes look scattered at random along the number line, yet Bernhard Riemann showed in 1859 that the exact staircase of primes is built by adding smooth harmonic waves—one wave for each nontrivial zero of $\\zeta(s)$—like Fourier harmonics sculpting the timbre of a violin!", "prompt": "Gemini, explain Riemann's Explicit Formula using the analogy of musical overtones summing together to form sharp prime steps.", "followup_prompt": "Gemini, tell me the wild story of Freeman Dyson and Hugh Montgomery discovering at tea in Princeton that Zeta zeros match heavy-atom quantum energy levels.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_12_ag_3.mp3"}, {"pillar": "adhd_zorba", "short": "🦁 Zorba & Flow", "category": "🦁 2e-ADHD Leverage, Zorba Embodiment & Play", "title": "3-Bucket Horizon Clearing ('Today's 2' vs. 'Parked Safely in KORTEX')", "detail": "Skewed time sense stamps 6-month dreams as 'overdue at 4 PM today'. Physically park every multi-month horizon item inside KORTEX so only 1–2 light, concrete moves sit on today's desk—giving you 100% permission to call the day a win early.", "prompt": "Gemini, ask me what's floating in my head right now so we can keep at most 2 light items for today and park everything else cleanly.", "followup_prompt": "Gemini, confirm my 'Done for Today' line so I know the exact moment I'm off the clock.", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/games/day_12_ag_4.mp3"}]}, {"day": 13, "phase": "Unburdened Presence", "title": "Satyajit Ray's Chiaroscuro Light & 'Amake Amar Moto Thakte Dao'", "sub": "Chiaroscuro Seeing: Light, Shadow & Satyajit Ray's Frame • Poetry-at-Speed: Tracking Metaphor Chains by Ear • Bengali Cinema Poetry", "audio_url": "https://raw.githubusercontent.com/kouSeek/portfolio/ai-companion-audio/audio/anondo/days/day_13.mp3", "games": [{"pillar": "personal_therapy", "short": "💬 Inner Clarity", "category": "💬 Inner-Child, Visionary & Expressive Clarity", "title": "Chiaroscuro Seeing: Light, Shadow & Satyajit Ray's Frame", "detail": "From Leonardo da Vinci's chiaroscuro to Subrata Mitra and Satyajit Ray pioneering bounce-lighting in Pather Panchali, great visual art never floods every corner with flat harsh light—it lets shadow give depth to the light. Your own emotional depth works the exact same way.", "prompt": "Gemini, tell me the story of how Satyajit Ray and Subrata Mitra invented bounce-cloth lighting for Aparajito, and connect it to DSLR street framing.", "followup_prompt": "Gemini, suggest one tiny 10-minute light-and-shadow photography expe
